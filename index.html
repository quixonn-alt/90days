<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>90 יום</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0E1116">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="90 יום">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@500;700;800;900&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0E1116;
    --surface:#161B22;
    --surface-2:#1F2630;
    --line:#2D3642;
    --text:#E6EDF3;
    --muted:#9AA4B2;
    --amber:#F59E0B;     /* מינימום / הדגשה */
    --green:#10B981;     /* בוצע במלואו */
    --on-color:#0E1116;  /* טקסט על ענבר/ירוק — תמיד כהה */
    --danger:#F87171;
    --hatch:repeating-linear-gradient(-45deg, #3A4452 0 3px, var(--surface-2) 3px 6px);
    --r:14px;
    --r-sm:10px;
    --font-display:'Heebo', system-ui, sans-serif;
    --font-body:'Rubik', system-ui, sans-serif;
    --nav-h:64px;
    color-scheme:dark;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  button{ touch-action:manipulation; font:inherit; color:inherit; }
  html,body{ margin:0; background:var(--bg); color:var(--text); font-family:var(--font-body); }
  body{ min-height:100vh; padding-bottom:calc(var(--nav-h) + 24px + env(safe-area-inset-bottom, 0px)); line-height:1.5; }
  h1,h2,h3{ font-family:var(--font-display); margin:0; letter-spacing:-0.01em; }
  h1.page{ font-size:1.6rem; margin-bottom:12px; }
  :focus-visible{ outline:3px solid var(--amber); outline-offset:2px; }
  [hidden]{ display:none !important; }
  @media (prefers-reduced-motion:reduce){ *{ transition:none !important; animation:none !important; } }

  .ic{ width:1.25em; height:1.25em; fill:none; stroke:currentColor; stroke-width:2.25; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0; }
  .num{ font-variant-numeric:tabular-nums; }

  .wrap{
    padding:calc(16px + env(safe-area-inset-top, 0px)) calc(16px + env(safe-area-inset-right, 0px)) 16px calc(16px + env(safe-area-inset-left, 0px));
    max-width:640px; margin:0 auto;
  }

  .card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:16px; margin-bottom:12px; }
  .card h2{ font-size:1.15rem; margin-bottom:8px; }
  .card h3{ font-size:1rem; margin-bottom:4px; }
  .card.accent{ border-color:rgba(245,158,11,0.55); }
  .muted{ color:var(--muted); }
  .small{ font-size:0.88rem; }
  .label{ font-family:var(--font-display); font-weight:700; font-size:0.9rem; color:var(--muted); margin:0 0 8px; }
  .tag{ display:inline-block; font-size:0.75rem; font-weight:700; color:var(--muted); border:1px solid var(--line); border-radius:99px; padding:1px 8px; margin-inline-start:6px; vertical-align:middle; }
  p.flush{ margin:0; }

  /* ---------- header ---------- */
  .day-head{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:12px; }
  .day-head h1{ font-size:2.2rem; font-weight:900; line-height:1.1; }
  .day-head h1 .of{ font-size:1.1rem; color:var(--muted); font-weight:700; }
  .kept{ font-size:0.95rem; color:var(--muted); text-align:left; }
  .kept b{ color:var(--amber); font-size:1.1rem; }
  .bar{ height:8px; background:var(--surface-2); border-radius:99px; overflow:hidden; margin-bottom:16px; }
  .bar > i{ display:block; height:100%; background:linear-gradient(90deg, var(--amber), var(--green)); border-radius:99px; }
  .identity{ font-size:0.95rem; color:var(--muted); border-right:3px solid var(--amber); padding-right:12px; margin:0 0 16px; }

  .date-nav{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:12px; }
  .date-nav .dn-label{ font-family:var(--font-display); font-weight:800; font-size:1.05rem; text-align:center; flex:1; }
  .icon-btn{
    width:48px; height:48px; border-radius:var(--r-sm); flex:0 0 auto;
    background:var(--surface); border:1px solid var(--line);
    display:inline-flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .icon-btn.sm{ width:40px; height:40px; }
  .icon-btn:disabled{ opacity:0.35; cursor:default; }
  .icon-btn:active:not(:disabled){ background:var(--surface-2); }

  /* ---------- habit card ---------- */
  .habit{ position:relative; overflow:hidden; }
  .habit::before{ content:""; position:absolute; top:0; bottom:0; right:0; width:5px; background:var(--line); }
  .habit.s-full::before{ background:var(--green); }
  .habit.s-min::before{ background:var(--amber); }
  .habit.s-miss::before{ background:repeating-linear-gradient(-45deg, var(--muted) 0 3px, transparent 3px 6px); }
  .habit-name{ font-family:var(--font-display); font-weight:800; font-size:1.15rem; }
  .habit-anchor{ font-size:0.88rem; color:var(--muted); margin-top:2px; }
  .habit-versions{ display:flex; gap:16px; flex-wrap:wrap; font-size:0.9rem; margin:8px 0 12px; }
  .habit-versions span b{ font-weight:600; color:var(--muted); }

  .tri{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
  .tri button{
    height:56px; border-radius:var(--r-sm); background:var(--surface-2); border:2px solid var(--line);
    font-family:var(--font-display); font-weight:800; font-size:0.98rem;
    display:flex; align-items:center; justify-content:center; gap:6px; cursor:pointer;
    transition:background .12s, border-color .12s;
  }
  .tri button:active{ transform:scale(0.98); }
  .tri button[aria-pressed="true"][data-v="full"]{ background:var(--green); border-color:var(--green); color:var(--on-color); }
  .tri button[aria-pressed="true"][data-v="min"]{ background:var(--amber); border-color:var(--amber); color:var(--on-color); }
  .tri button[aria-pressed="true"][data-v="miss"]{ background:var(--text); border-color:var(--text); color:var(--on-color); }

  /* ---------- buttons / forms ---------- */
  .btn{
    width:100%; min-height:56px; border-radius:var(--r-sm); border:2px solid var(--line); background:var(--surface-2);
    font-family:var(--font-display); font-weight:800; font-size:1.05rem;
    display:flex; align-items:center; justify-content:center; gap:8px; cursor:pointer; padding:0 16px; margin-top:8px;
  }
  .btn:active{ transform:scale(0.99); }
  .btn-primary{ background:var(--amber); border-color:var(--amber); color:var(--on-color); }
  .btn-green{ background:var(--green); border-color:var(--green); color:var(--on-color); }
  .btn-ghost{ background:transparent; }
  .btn-danger{ background:transparent; border-color:var(--danger); color:var(--danger); }
  .btn-sm{ min-height:44px; font-size:0.92rem; width:auto; padding:0 14px; }
  .btn:disabled{ opacity:0.45; cursor:default; transform:none; }
  .row{ display:flex; gap:8px; }
  .row > *{ flex:1; min-width:0; }

  .field{ margin-bottom:12px; }
  .field label{ display:block; font-family:var(--font-display); font-weight:700; font-size:0.92rem; margin-bottom:6px; }
  .field .hint{ font-size:0.84rem; color:var(--muted); margin:-2px 0 6px; }
  input[type=text], input[type=number], input[type=date], input[type=time], textarea, select{
    width:100%; min-height:52px; padding:12px; background:var(--bg); color:var(--text);
    border:2px solid var(--line); border-radius:var(--r-sm); font-family:var(--font-body); font-size:1rem; outline:none;
  }
  textarea{ min-height:84px; resize:vertical; line-height:1.5; }
  input:focus, textarea:focus, select:focus{ border-color:var(--amber); }

  .score{ display:grid; grid-template-columns:repeat(11, 1fr); gap:4px; }
  .score button{
    height:44px; border-radius:8px; border:2px solid var(--line); background:var(--surface-2);
    font-family:var(--font-display); font-weight:800; font-size:0.9rem; cursor:pointer; padding:0;
  }
  .score button[aria-pressed="true"]{ background:var(--amber); border-color:var(--amber); color:var(--on-color); }

  .days-pick{ display:grid; grid-template-columns:repeat(7, 1fr); gap:6px; }
  .days-pick button{ height:48px; border-radius:var(--r-sm); border:2px solid var(--line); background:var(--surface-2); font-family:var(--font-display); font-weight:800; cursor:pointer; }
  .days-pick button[aria-pressed="true"]{ background:var(--amber); border-color:var(--amber); color:var(--on-color); }

  .chips{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{ min-height:44px; padding:0 14px; border-radius:99px; border:2px solid var(--line); background:var(--surface-2); font-family:var(--font-display); font-weight:700; font-size:0.92rem; cursor:pointer; }
  .chip[aria-pressed="true"]{ background:var(--amber); border-color:var(--amber); color:var(--on-color); }

  .check-row{ display:flex; align-items:flex-start; gap:12px; min-height:52px; padding:12px 0; border-bottom:1px solid var(--line); cursor:pointer; }
  .check-row:last-child{ border-bottom:none; }
  .check-row input{ width:26px; height:26px; accent-color:var(--green); flex-shrink:0; margin:0; }
  .check-row.done > span{ color:var(--muted); text-decoration:line-through; }

  .step{ padding:12px 0; border-bottom:1px solid var(--line); }
  .step:last-child{ border-bottom:none; }
  .step .check-row{ border-bottom:none; padding:0; min-height:0; }
  .step-actions{ display:flex; gap:8px; flex-wrap:wrap; margin:8px 38px 0 0; }
  .counter{ display:inline-flex; align-items:center; gap:8px; }
  .counter b{ font-family:var(--font-display); font-size:1.3rem; min-width:36px; text-align:center; }

  .list-item{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px; padding:12px 0; border-bottom:1px solid var(--line); }
  .list-item:last-child{ border-bottom:none; }
  .list-item .li-meta{ font-size:0.82rem; color:var(--muted); white-space:nowrap; display:flex; align-items:center; gap:8px; }
  .list-btn{ width:100%; background:none; border:none; border-bottom:1px solid var(--line); text-align:right; cursor:pointer; padding:12px 0; display:flex; align-items:center; gap:12px; }
  .list-btn:last-child{ border-bottom:none; }
  .list-btn .lb-main{ flex:1; min-width:0; }
  .list-btn .lb-title{ font-family:var(--font-display); font-weight:800; font-size:1rem; }
  .list-btn .lb-sub{ font-size:0.84rem; color:var(--muted); }
  .pill{ font-size:0.78rem; font-weight:700; border-radius:99px; padding:2px 10px; background:var(--surface-2); color:var(--muted); white-space:nowrap; }
  .pill.done{ background:var(--green); color:var(--on-color); }
  .pill.now{ background:var(--amber); color:var(--on-color); }

  .notice{ background:rgba(245,158,11,0.12); border:1px solid rgba(245,158,11,0.4); border-radius:var(--r-sm); padding:12px; font-size:0.92rem; margin-bottom:12px; }
  .notice.good{ background:rgba(16,185,129,0.12); border-color:rgba(16,185,129,0.4); }

  .quote{ border-right:3px solid var(--line); padding-right:12px; margin:8px 0; white-space:pre-wrap; }
  .quote.anti{ border-color:var(--danger); }
  .quote.want{ border-color:var(--green); }

  /* ---------- board ---------- */
  .board{ display:grid; grid-template-columns:repeat(7, 1fr); gap:6px; }
  .board .wk{ grid-column:1 / -1; font-size:0.78rem; color:var(--muted); margin-top:4px; }
  .cell{
    aspect-ratio:1; border-radius:6px; background:var(--surface-2); display:flex; align-items:center; justify-content:center;
    font-size:0.72rem; font-weight:600; color:var(--muted); border:1px solid transparent; padding:0; cursor:pointer;
  }
  .cell.full{ background:var(--green); color:var(--on-color); }
  .cell.min{ background:var(--amber); color:var(--on-color); }
  .cell.miss{ background:var(--hatch); color:var(--text); }
  .cell.open{ border-color:var(--muted); color:var(--text); }
  .cell.rest{ background:transparent; border-color:var(--line); }
  .cell.future{ background:transparent; border:1px dashed var(--line); cursor:default; }
  .cell.today{ outline:2px solid var(--text); outline-offset:1px; }
  .legend{ display:flex; flex-wrap:wrap; gap:12px; font-size:0.82rem; color:var(--muted); margin-top:12px; }
  .legend span{ display:inline-flex; align-items:center; gap:6px; }
  .legend i{ width:14px; height:14px; border-radius:4px; display:inline-block; }

  .stat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:12px; }
  .stat{ background:var(--surface); border:1px solid var(--line); border-radius:var(--r-sm); padding:12px; }
  .stat b{ display:block; font-family:var(--font-display); font-size:1.5rem; font-weight:900; }
  .stat span{ font-size:0.84rem; color:var(--muted); }

  .goal-line{ display:flex; justify-content:space-between; gap:8px; font-size:0.92rem; margin:4px 0; }
  .goal-bar{ position:relative; height:12px; background:var(--surface-2); border-radius:99px; overflow:hidden; margin:8px 0; }
  .goal-bar i{ position:absolute; top:0; bottom:0; right:0; background:var(--green); border-radius:99px; }
  .goal-bar u{ position:absolute; top:-2px; bottom:-2px; width:3px; background:var(--text); }

  .audit-row{ display:flex; align-items:center; gap:8px; margin:8px 0; font-size:0.92rem; }
  .audit-row .an{ width:88px; font-weight:600; }
  .audit-row .ab{ flex:1; height:10px; background:var(--surface-2); border-radius:99px; position:relative; overflow:hidden; }
  .audit-row .ab i{ position:absolute; top:0; bottom:0; right:0; background:var(--amber); border-radius:99px; }
  .audit-row .ab u{ position:absolute; top:0; bottom:0; right:0; background:rgba(154,164,178,0.35); border-radius:99px; }
  .audit-row .av{ width:64px; text-align:left; color:var(--muted); }

  /* ---------- week table ---------- */
  .wtable{ width:100%; border-collapse:collapse; font-size:0.85rem; }
  .wtable th{ font-weight:600; color:var(--muted); padding:4px 2px; font-size:0.78rem; }
  .wtable td{ padding:3px 2px; text-align:center; }
  .wtable td.hn{ text-align:right; font-weight:600; padding-left:6px; max-width:96px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .dot{ display:inline-block; width:22px; height:22px; border-radius:6px; background:var(--surface-2); }
  .dot.full{ background:var(--green); }
  .dot.min{ background:var(--amber); }
  .dot.miss{ background:var(--hatch); }
  .dot.rest{ background:transparent; border:1px solid var(--line); }
  .dot.none{ background:transparent; border:1px dashed var(--muted); }
  .pattern-row{ display:flex; align-items:center; gap:8px; font-size:0.88rem; margin:6px 0; }
  .pattern-row .pd{ width:44px; color:var(--muted); }
  .pattern-row .pb{ flex:1; height:10px; background:var(--surface-2); border-radius:99px; overflow:hidden; }
  .pattern-row .pb i{ display:block; height:100%; background:var(--muted); }
  .pattern-row .pv{ width:44px; text-align:left; color:var(--muted); }
  .update-box{ background:var(--bg); border:1px solid var(--line); border-radius:var(--r-sm); padding:12px; white-space:pre-wrap; font-size:0.95rem; line-height:1.6; }

  .spark{ width:100%; height:64px; display:block; margin:8px 0; direction:ltr; }
  .spark polyline{ fill:none; stroke:var(--amber); stroke-width:2.5; stroke-linejoin:round; stroke-linecap:round; }
  .spark line{ stroke:var(--muted); stroke-width:1.5; stroke-dasharray:4 4; }
  .spark circle{ fill:var(--amber); }

  /* ---------- focus timer ---------- */
  .timer{ font-family:var(--font-display); font-weight:900; font-size:4rem; text-align:center; line-height:1; margin:16px 0 4px; direction:ltr; }
  .timer-sub{ text-align:center; color:var(--muted); margin-bottom:16px; }
  .urge-btn{
    width:100%; height:96px; border-radius:var(--r); border:2px solid var(--amber); background:rgba(245,158,11,0.12);
    font-family:var(--font-display); font-weight:900; font-size:1.25rem; color:var(--text); cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  }
  .urge-btn small{ font-weight:600; font-size:0.85rem; color:var(--muted); }
  .urge-btn:active{ background:var(--amber); color:var(--on-color); }

  /* ---------- nav ---------- */
  .nav{
    position:fixed; bottom:0; right:0; left:0; z-index:20; background:rgba(14,17,22,0.96); border-top:1px solid var(--line);
    padding:0 calc(4px + env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) calc(4px + env(safe-area-inset-left, 0px));
    display:grid; grid-template-columns:repeat(5, 1fr);
  }
  .nav button{
    height:var(--nav-h); background:none; border:none; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
    font-family:var(--font-display); font-weight:700; font-size:0.76rem; color:var(--muted);
  }
  .nav button .ic{ width:24px; height:24px; }
  .nav button[aria-current="page"]{ color:var(--amber); }

  /* ---------- sheet ---------- */
  .sheet-overlay{ position:fixed; inset:0; z-index:40; background:rgba(0,0,0,0.65); display:flex; align-items:flex-end; }
  .sheet{
    width:100%; max-width:640px; margin:0 auto; background:var(--surface); border-radius:18px 18px 0 0; border-top:1px solid var(--line);
    padding:20px calc(16px + env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) calc(16px + env(safe-area-inset-left, 0px));
    max-height:calc(92dvh - env(safe-area-inset-top, 0px)); overflow-y:auto; animation:up .2s ease-out;
  }
  @keyframes up{ from{ transform:translateY(6%); opacity:.6; } }
  .sheet h2{ font-size:1.4rem; margin-bottom:4px; }

  /* ---------- wizard ---------- */
  .steps{ display:flex; gap:4px; margin-bottom:20px; }
  .steps i{ flex:1; height:4px; border-radius:99px; background:var(--surface-2); }
  .steps i.on{ background:var(--amber); }
  .wiz h1{ font-size:1.7rem; font-weight:900; margin-bottom:8px; }
  .wiz .lead{ color:var(--muted); margin:0 0 20px; }
  .wiz-foot{ display:flex; gap:8px; margin-top:16px; }
  .wiz-foot .btn{ margin-top:0; }

  .toast{
    position:fixed; left:50%; transform:translateX(-50%); bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom, 0px));
    background:var(--text); color:var(--on-color); z-index:60; padding:12px 18px; border-radius:99px; font-weight:600; font-size:0.92rem;
    max-width:calc(100% - 32px); text-align:center;
  }
  details > summary{ cursor:pointer; min-height:36px; display:flex; align-items:center; color:var(--muted); font-size:0.9rem; }
</style>
</head>
<body>

<div id="app"></div>
<nav class="nav" id="nav" hidden></nav>
<div id="sheet" class="sheet-overlay" hidden><div class="sheet" id="sheetBody"></div></div>
<div id="toast" class="toast" hidden role="status"></div>

<script>
(function(){
  'use strict';

  /* =========================================================
     קבועים
     ========================================================= */

  const STORE_KEY = 'ninety-state';
  const PUSH_URL = 'https://ninety-push.quixonn.workers.dev';
  const VAPID_PUBLIC = 'BJKyvhBWgfLTIVYpYLaT_YUSO09f8_5BlQj-Z8w_Etm_s3D6REt2Swn0HMZvMFBNHRs4HKAwF1k2jccWi4hhsng';
  const DAY_SHORT = ['א׳','ב׳','ג׳','ד׳','ה׳','ו׳','ש׳'];
  const DAY_LONG = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
  const AREAS = [
    { id:'health', name:'בריאות', ex:'משקל, אימונים בשבוע, שינה, ריצה' },
    { id:'wealth', name:'כסף', ex:'הכנסה חודשית, חיסכון, חוב, לקוחות' },
    { id:'love', name:'אהבה ויחסים', ex:'דייט בשבוע, זמן בלי טלפונים, פחות ריבים פתוחים' },
    { id:'self', name:'עצמי', ex:'ספרים, מדיטציה, שפה, יומן, דברים שאתה נהנה מהם' }
  ];

  /* ---------- ספריית התרגילים — מתוך 30 ההדרכות ----------
     כל צעד יכול להציע פעולה: habit (להוסיף כהרגל), counter (מונה),
     focus (לפתוח בלוק פוקוס), receipt (לרשום קבלה). */
  const EXERCISES = [

  function icon(n){ return '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false">' + ICONS[n] + '</svg>'; }

  /* =========================================================
     תאריכים — תמיד מקומי YYYY-MM-DD
     ========================================================= */

  function pad(n){ return String(n).padStart(2,'0'); }
  function ds(d){ return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
  function parse(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
  function today(){ return ds(new Date()); }
  function addDays(s, n){ const d = parse(s); d.setDate(d.getDate() + n); return ds(d); }
  function diffDays(a, b){
    const [ay,am,ad] = a.split('-').map(Number), [by,bm,bd] = b.split('-').map(Number);
    return Math.round((Date.UTC(by,bm-1,bd) - Date.UTC(ay,am-1,ad)) / 86400000);
  }
  function weekday(s){ return parse(s).getDay(); }
  function fmt(s){ const [, m, d] = s.split('-'); return d + '/' + m; }
  function fmtLong(s){ return 'יום ' + DAY_LONG[weekday(s)] + ', ' + fmt(s); }
  function round(n){ return Math.round(n * 100) / 100; }

  /* =========================================================

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  function emptyState(){
    return {

      days:{},        // 'YYYY-MM-DD' → { h:{habitId:'full'|'min'|'miss'}, closed, prep }
      receipts:[],    // { id, date, text }
      goalLog:[],     // { id, date, goalId, value }

      ex:{},          // exerciseId → { steps:{i:true}, counts:{i:n}, notes, doneOn }

  }

  let S = load();

  function load(){
    try{
      const raw = localStorage.getItem(STORE_KEY);
      if(raw) return Object.assign(emptyState(), JSON.parse(raw));
    }catch(e){}
    return emptyState();
  }

  function save(){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(S)); }
    catch(e){ toast('השמירה נכשלה — נסה שוב'); }
    writeSwConfig();

  function tick(ms){ try{ if(navigator.vibrate) navigator.vibrate(ms || 12); }catch(e){} }
  function esc(v){ return String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function nl(v){ return esc(v).replace(/\n/g, '<br>'); }

  let toastTimer;
  function toast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.hidden = true; }, 2600);

  /* =========================================================
     חישובים
     ========================================================= */

  function L(){ return S.setup ? (S.setup.length || 90) : 90; }
  function habits(){ return S.setup ? S.setup.habits : []; }
  function activeHabits(){ return habits().filter(h => !h.archivedOn); }

  function scheduled(h, date){
    if(date < (h.from || S.setup.startDate)) return false;
    if(h.archivedOn && date >= h.archivedOn) return false;
    return h.days.includes(weekday(date));
  }
  function habitsOn(date){ return habits().filter(h => scheduled(h, date)); }
  function dayIndex(date){ return diffDays(S.setup.startDate, date) + 1; }
  function endDate(){ return addDays(S.setup.startDate, L() - 1); }
  function inRange(date){ const i = dayIndex(date); return i >= 1 && i <= L(); }
  function mark(date, hid){ const d = S.days[date]; return d && d.h ? d.h[hid] : undefined; }

  /* full = הכול במלואו, min = עמדת (חלק במינימום), miss = פוספס, open = לא סומן, rest = אין הרגלים. */
  function dayStatus(date){
    const hs = habitsOn(date);
    if(hs.length === 0) return 'rest';
    let anyMin = false, anyMiss = false, anyOpen = false;
    hs.forEach(h => {
      const m = mark(date, h.id);
      if(m === 'min') anyMin = true;
      else if(m === 'miss') anyMiss = true;
      else if(m !== 'full') anyOpen = true;
    });
    if(anyMiss) return 'miss';
    if(anyOpen) return 'open';
    return anyMin ? 'min' : 'full';
  }

  /* "X ימים מתוך Y" — יום שפוספס לא מאפס כלום, הוא פשוט לא נספר ב־X. */
  function keptStats(){
    const t = today();
    let kept = 0, passed = 0;
    for(let i = 0; i < L(); i++){
      const date = addDays(S.setup.startDate, i);
      if(date > t) break;
      const st = dayStatus(date);
      const closed = S.days[date] && S.days[date].closed;
      if(date === t && !closed){ if(st === 'full' || st === 'min'){ kept++; passed++; } continue; }
      if(st === 'rest') continue;
      passed++;
      if(st === 'full' || st === 'min') kept++;
    }
    return { kept, passed };
  }

  function habitFreqText(h){
    if(h.days.length === 7) return 'כל יום';
    return h.days.length + ' פעמים בשבוע (' + h.days.map(d => DAY_SHORT[d]).join(' ') + ')';
  }

  function weekOf(date){ return Math.floor((dayIndex(date) - 1) / 7) + 1; }
  function weekRange(w){
    const a = addDays(S.setup.startDate, (w-1)*7);
    let b = addDays(a, 6);
    if(b > endDate()) b = endDate();
    return [a, b];
  }
  function currentWeek(){
    const t = today();
    if(t < S.setup.startDate) return 1;
    if(t > endDate()) return weekOf(endDate());
    return weekOf(t);
  }

  /* ---------- יעדים במספרים (ABTH: Actual, Becoming, Timeline, Habits) ---------- */

  function goalLatest(g){
    const log = S.goalLog.filter(x => x.goalId === g.id).sort((a,b) => a.date.localeCompare(b.date));
    return log.length ? log[log.length - 1].value : g.actual;
  }
  /* איפה צריך להיות היום לפי קצב ישר מהנקודה ההתחלתית ליעד. */
  function goalExpected(g, date){
    const i = Math.max(0, Math.min(L(), dayIndex(date || today())));
    return g.actual + (g.target - g.actual) * i / L();
  }
  function goalStatus(g){
    const cur = goalLatest(g), exp = goalExpected(g), up = g.target >= g.actual;
    const gap = g.target - g.actual;
    if(gap === 0) return 'on';
    const diff = (cur - exp) * (up ? 1 : -1);
    if(diff >= -Math.abs(gap) * 0.02) return 'on';
    return 'behind';
  }
  function goalPaceText(g){
    const gap = g.target - g.actual;
    const perDay = gap / L(), perWeek = perDay * 7, perMonth = perDay * 30;
    const u = g.unit ? ' ' + g.unit : '';
    /* בידוד כיווני כדי שמינוס/פלוס יישארו משמאל למספר גם בתוך טקסט RTL */
    const s = n => '⁦' + (n > 0 ? '+' : '') + round(n) + '⁩';
    return 'קצב: ' + s(perDay) + u + ' ביום · ' + s(perWeek) + ' בשבוע · ' + s(perMonth) + ' בחודש';
  }

    view = v;
    if(v === 'today') viewDate = clampDate(today());

  function clampDate(d){
    if(!S.setup) return d;
    if(d < S.setup.startDate) return S.setup.startDate;
    if(d > endDate()) return endDate();
    return d;
  }

  function renderNav(){
    const nav = document.getElementById('nav');
    nav.hidden = !S.setup;
    nav.innerHTML = NAV.map(n =>

  const ENV_SUGGEST = [
    { t:'למחוק אפליקציות גלילה אינסופית מהטלפון', on:true },
    { t:'להכין את בגדי האימון מהערב', on:false },
    { t:'לכתוב את האימון של מחר מראש', on:false },
    { t:'להשאיר בבית רק את האוכל שאני רוצה לאכול', on:false },
    { t:'לשים את הספר במקום שבו אני באמת קורא', on:false },
    { t:'לפתוח את המחשב ישר על המשימה החשובה — בלי מייל ויוטיוב', on:false },
    { t:'טלפון מחוץ לחדר השינה', on:false },
    { t:'לבחור חדר כושר קרוב, גם אם הוא לא המושלם', on:false },
    { t:'לצמצם זמן עם מי שמושך אחורה, להגדיל עם מי שמרים', on:false }
  ];

  function newDraft(){
    const audit = {}; AREAS.forEach(a => { audit[a.id] = { score:null, evidence:'', trend:'' }; });
    const vision = {}; AREAS.forEach(a => { vision[a.id] = ''; });
    return {
      startDate: today(), length:90,
      audit, vision, week:'', anti:'',
      reasons:{ here:'', want:'', refuse:'' },
      identity:{ who:'', day:'', stop:'', seen:'' },
      goals:[],
      habits:[],
      env: ENV_SUGGEST.map(e => ({ id:uid(), text:e.t, on:e.on, done:false })),
      partner:{ name:'' },
      notify:{ morning:'06:30', evening:'21:30', weeklyDay:5, weeklyTime:'12:00', on:false }
    };
  }

  const WIZ = ['פתיחה','ביקורת מציאות','שני עתידים','סיבות','זהות','יעדים במספרים','הרגלים','סביבה','אדם אחד','התראות'];

  function renderWizard(){
    if(!draft) draft = newDraft();
    const d = draft;
    const steps = '<div class="steps">' + WIZ.map((_, i) => '<i class="' + (i <= wizStep ? 'on' : '') + '"></i>').join('') + '</div>';
    const stepLabel = '<p class="label">שלב ' + (wizStep + 1) + ' מתוך ' + WIZ.length + '</p>';
    let body = '';

    if(wizStep === 0){
      body =
        '<h1>להמציא את עצמך מחדש</h1>' +
        '<p class="lead">לא מחכים להרגיש כמו אדם חדש. בודקים בכנות איפה אתה, מחליטים לאן, הופכים את זה למספרים ולצעד של היום — ואז אוספים ראיות עד שהסיפור הישן כבר לא מחזיק.</p>' +
        '<div class="card"><h3>הסדר</h3><p class="small muted flush">' +
        '1. ביקורת מציאות: איפה אתה בארבעה תחומים.<br>2. שני עתידים: מה אתה רוצה, ומה אתה מסרב לו.<br>3. סיבות.<br>4. זהות מוחשית.<br>' +
        '5. יעדים במספרים, מפורקים ליום.<br>6. מעט הרגלים — לכל אחד רגיל ומינימום.<br>7. סביבה — בעיקר להוריד.<br>8. לסמן כל יום, לסקור כל שבוע, ותרגיל אחד בשבוע מתוך הספרייה.</p></div>' +
        '<div class="field"><label for="w-start">תאריך התחלה</label><input type="date" id="w-start" value="' + d.startDate + '"></div>' +
        '<div class="field"><label>אורך העונה</label><div class="hint">90 יום זה ארוך מספיק לשנות משהו אמיתי וקצר מספיק לראות את כולו. אפשר עונה ארוכה יותר.</div><div class="chips" id="w-len">' +
          [90,180,365].map(n => '<button type="button" class="chip" data-len="' + n + '" aria-pressed="' + (d.length === n) + '">' + (n === 90 ? '90 יום' : n === 180 ? 'חצי שנה' : 'שנה') + '</button>').join('') +
        '</div></div>' +
        '<p class="small muted">כמעט הכול אפשר לדלג ולמלא אחר כך במסך "תוכנית". חובה רק הרגל אחד.</p>';
    }

    if(wizStep === 1){
      body =
        '<h1>ביקורת מציאות</h1>' +
        '<p class="lead">אי אפשר לתקן בלי להשוות לנקודה אמיתית. ציון 0–10 לכל תחום, הראיות שמאחוריו, ולאן הוא הולך אם לא משנים כלום.</p>' +
        AREAS.map(a => {
          const au = d.audit[a.id];
          return '<div class="card"><h2>' + a.name + '</h2>' +
            '<div class="score" data-area="' + a.id + '">' + Array.from({length:11}, (_, i) => '<button type="button" data-score="' + i + '" aria-pressed="' + (au.score === i) + '" aria-label="' + i + '">' + i + '</button>').join('') + '</div>' +
            '<div class="field" style="margin-top:12px"><label for="w-ev-' + a.id + '">הראיות</label><textarea id="w-ev-' + a.id + '" placeholder="מה בפועל קורה, לא איך זה מרגיש">' + esc(au.evidence) + '</textarea></div>' +
            '<div class="field" style="margin-bottom:0"><label for="w-tr-' + a.id + '">לאן זה הולך אם לא משנים כלום?</label><input type="text" id="w-tr-' + a.id + '" value="' + esc(au.trend) + '"></div></div>';
        }).join('');
    }

    if(wizStep === 2){
      body =
        '<h1>שני עתידים</h1>' +
        '<p class="lead">"אני רוצה להצליח" לא נותן כלום לעבוד איתו. איך כל תחום נראה ביום ' + d.length + '? ומה העתיד שאתה מסרב להמשיך ללכת אליו?</p>' +
        AREAS.map(a => '<div class="field"><label for="w-vi-' + a.id + '">' + a.name + ' ביום ' + d.length + '</label><div class="hint">' + a.ex + '</div><textarea id="w-vi-' + a.id + '">' + esc(d.vision[a.id]) + '</textarea></div>').join('') +
        '<div class="field"><label for="w-week">שבוע רגיל בסוף העונה</label><div class="hint">איך נראים הבקרים? עם מי אתה? מה כבר לא מדאיג אותך?</div><textarea id="w-week">' + esc(d.week) + '</textarea></div>' +
        '<div class="field"><label for="w-anti">העתיד שאתה מסרב לו</label><div class="hint">אם שום דבר לא משתנה — איך החיים נראים בעוד שנה? שלוש שנים?</div><textarea id="w-anti">' + esc(d.anti) + '</textarea></div>';
    }

    if(wizStep === 3){
      body =
        '<h1>סיבות</h1>' +
        '<p class="lead">היעד מתחרה כל יום בעשרות פרסים קרובים יותר — גלילה, נטפליקס, להישאר במיטה. הסיבות הן מה שגורם לעתיד להשפיע על ההווה.</p>' +
        field('w-r-here', 'למה אתה איפה שאתה?', 'ההחלטות, ההרגלים, ההנחות והסביבות שייצרו את הציונים', d.reasons.here, true) +
        field('w-r-want', 'למה אתה באמת רוצה את העתיד שתיארת?', '', d.reasons.want, true) +
        field('w-r-refuse', 'למה אתה מסרב לעתיד השני?', '', d.reasons.refuse, true);
    }

    if(wizStep === 4){
      body =
        '<h1>מי אתה הופך להיות</h1>' +
        '<p class="lead">לא "הגרסה הכי טובה שלי". מה האדם הזה <b>עושה</b> ביום רגיל?</p>' +
        field('w-who', 'במשפט אחד', 'למשל: מישהו שמתאמן 4 פעמים בשבוע וכותב כל בוקר', d.identity.who, true) +
        field('w-day', 'מה הוא עושה ביום רגיל?', 'איך הוא מתאמן, איך הוא עובד, מתי הוא קם', d.identity.day, true) +
        field('w-stop', 'ממה הוא הפסיק?', 'למשל: לגלול במיטה, לדחות למחר', d.identity.stop, true) +
        field('w-seen', 'מה מישהו היה רואה אם היה עוקב אחריו שבוע?', '', d.identity.seen, true);
    }

    if(wizStep === 5){
      body =
        '<h1>יעדים במספרים</h1>' +
        '<p class="lead">אחד או שניים. המבחן: בסוף העונה, שני אנשים שונים יכולים להסכים אם הגעת? יעד = <b>איפה אני</b>, <b>לאן</b>, <b>עד מתי</b> — והאפליקציה מחשבת את הקצב ליום.</p>' +
        (d.goals.length ? d.goals.map((g, i) =>
          '<div class="card"><div class="row" style="align-items:center"><div style="flex:3">' +
          '<div class="habit-name">' + esc(g.name) + '</div>' +
          '<div class="small">' + round(g.actual) + ' ← ' + round(g.target) + ' ' + esc(g.unit) + '</div>' +
          '<div class="small muted">' + goalPaceText(Object.assign({}, g)) + '</div></div>' +
          '<div style="flex:0 0 auto" class="row"><button class="icon-btn" data-act="wiz-edit-goal" data-i="' + i + '" aria-label="עריכה">' + icon('settings') + '</button>' +
          '<button class="icon-btn" data-act="wiz-del-goal" data-i="' + i + '" aria-label="מחיקה">' + icon('trash') + '</button></div></div></div>'
        ).join('') : '<div class="notice">למשל: לקרוא 10 ספרים = 2,000 עמודים ב־90 יום → 22 עמודים ביום. היום כבר יש משימה.</div>') +
        (d.goals.length < 2 ? '<button class="btn btn-ghost" data-act="wiz-add-goal">' + icon('plus') + ' הוספת יעד</button>' : '');
    }

    if(wizStep === 6){
      body =
        '<h1>הרגלים</h1>' +
        '<p class="lead">2–4 הרגלים שסוגרים את הפער — לא 20. המבחן: <b>אם אעשה את זה כל העונה, משהו משמעותי ישתנה?</b> אם לא, הוא לא צריך להיות פה.</p>' +
        (d.goals.length ? '<div class="notice">הקצב של היעדים: ' + d.goals.map(g => esc(g.name) + ' — ' + goalPaceText(g).replace('קצב: ', '')).join('<br>') + '</div>' : '') +
        (d.habits.length ? d.habits.map((h, i) =>
          '<div class="card"><div class="row" style="align-items:center"><div style="flex:3">' +
          '<div class="habit-name">' + esc(h.name) + '</div>' +
          '<div class="small muted">' + esc(habitFreqText(h)) + (h.anchor ? ' · ' + esc(h.anchor) : '') + '</div>' +
          '<div class="small">רגיל: ' + esc(h.full) + ' · מינימום: ' + esc(h.min) + '</div></div>' +
          '<div style="flex:0 0 auto" class="row"><button class="icon-btn" data-act="wiz-edit-habit" data-i="' + i + '" aria-label="עריכה">' + icon('settings') + '</button>' +
          '<button class="icon-btn" data-act="wiz-del-habit" data-i="' + i + '" aria-label="מחיקה">' + icon('trash') + '</button></div></div></div>'
        ).join('') : '<div class="notice">עוד לא הוספת הרגל. הראשון ברשימה מקבל את התראת הבוקר — שים שם את הכי חשוב, ועדיף לעשות אותו לפני שפותחים את הטלפון.</div>') +
        (d.habits.length < 4 ? '<button class="btn btn-ghost" data-act="add-habit">' + icon('plus') + ' הוספת הרגל</button>' : '');
    }

    if(wizStep === 7){
      body =
        '<h1>סביבה</h1>' +
        '<p class="lead">"להיעלם" ל־90 יום זה להיעלם מהחלקים בחיים הישנים שממשיכים לייצר את האדם שאתה מפסיק להיות. רוב השיפור בא מהורדה, לא מהוספה. מה שתסמן יופיע כרשימת הכנות במסך היום.</p>' +
        '<div class="card">' + d.env.map((e, i) =>
          '<label class="check-row"><input type="checkbox" data-act="wiz-env" data-i="' + i + '"' + (e.on ? ' checked' : '') + '><span>' + esc(e.text) + '</span></label>'
        ).join('') + '</div>' +
        '<div class="field"><label for="w-env-new">משהו משלך</label><div class="row"><input type="text" id="w-env-new" placeholder="למשל: לבטל את המנוי ל..."><button class="icon-btn" style="height:52px;width:52px" data-act="wiz-env-add" aria-label="הוספה">' + icon('plus') + '</button></div></div>';
    }

    if(wizStep === 8){
      body =
        '<h1>אדם אחד</h1>' +
        '<p class="lead">מישהו אחד שיודע את התוכנית המדויקת. פעם בשבוע האפליקציה תכין עדכון קצר: מה אמרתי, מה עשיתי, איפה פספסתי. חוץ ממנו — לשמור את זה בשקט; לדבר על שינוי נותן פרס לפני שעשית משהו.</p>' +
        field('w-partner', 'השם שלו', 'אפשר להשאיר ריק ולהוסיף אחר כך', d.partner.name, false);
    }

    if(wizStep === 9){
      const n = d.notify;
      body =
        '<h1>התראות</h1>' +
        '<p class="lead">בוקר — להרגל החשוב, לפני הטלפון. ערב — לסגירת היום. ופעם בשבוע — לסקירה.</p>' +
        notifyFields('w', n) +
        '<p class="small muted">את ההתראות עצמן מפעילים אחרי הסיום, במסך "תוכנית". באייפון זה עובד רק כשהאפליקציה פתוחה מהאייקון במסך הבית.</p>';
    }

    const foot = '<div class="wiz-foot">' +
      (wizStep > 0 ? '<button class="btn btn-ghost" data-act="wiz-back">הקודם</button>' : '') +
      (wizStep < WIZ.length - 1 ? '<button class="btn btn-primary" data-act="wiz-next">הבא</button>' : '<button class="btn btn-green" data-act="wiz-finish">מתחילים</button>') +
      '</div>' +
      (wizStep === 0 ? '<button class="btn btn-ghost" data-act="open-import">יש לי גיבוי — ייבוא</button>' : '');

    return '<div class="wrap wiz">' + steps + stepLabel + body + foot + '</div>';
  }

  function notifyFields(p, n){
    return '<div class="row"><div class="field"><label for="' + p + '-nm">בוקר</label><input type="time" id="' + p + '-nm" value="' + n.morning + '"></div>' +
      '<div class="field"><label for="' + p + '-ne">ערב</label><input type="time" id="' + p + '-ne" value="' + n.evening + '"></div></div>' +
      '<div class="row"><div class="field"><label for="' + p + '-nwd">סקירה — יום</label><select id="' + p + '-nwd">' + DAY_LONG.map((x, i) => '<option value="' + i + '"' + (i === Number(n.weeklyDay) ? ' selected' : '') + '>' + x + '</option>').join('') + '</select></div>' +
      '<div class="field"><label for="' + p + '-nwt">שעה</label><input type="time" id="' + p + '-nwt" value="' + n.weeklyTime + '"></div></div>';
  }
  function readNotify(p, n){
    n.morning = val(p + '-nm') || n.morning;
    n.evening = val(p + '-ne') || n.evening;
    n.weeklyDay = Number(val(p + '-nwd'));
    n.weeklyTime = val(p + '-nwt') || n.weeklyTime;
  }

  function field(id, label, hint, value, multi){
    return '<div class="field"><label for="' + id + '">' + label + '</label>' +
      (hint && multi ? '<div class="hint">' + hint + '</div>' : '') +
      (multi ? '<textarea id="' + id + '">' + esc(value) + '</textarea>'
             : '<input type="text" id="' + id + '" value="' + esc(value) + '" placeholder="' + esc(hint) + '">') +
      '</div>';
  }
  function val(id){ const el = document.getElementById(id); return el ? el.value.trim() : ''; }

  function captureWizard(){
    const d = draft;
    if(wizStep === 0){ d.startDate = val('w-start') || today(); }
    if(wizStep === 1){ AREAS.forEach(a => { d.audit[a.id].evidence = val('w-ev-' + a.id); d.audit[a.id].trend = val('w-tr-' + a.id); }); }
    if(wizStep === 2){ AREAS.forEach(a => { d.vision[a.id] = val('w-vi-' + a.id); }); d.week = val('w-week'); d.anti = val('w-anti'); }
    if(wizStep === 3){ d.reasons = { here:val('w-r-here'), want:val('w-r-want'), refuse:val('w-r-refuse') }; }
    if(wizStep === 4){ d.identity = { who:val('w-who'), day:val('w-day'), stop:val('w-stop'), seen:val('w-seen') }; }
    if(wizStep === 7){ document.querySelectorAll('[data-act="wiz-env"]').forEach(cb => { d.env[Number(cb.dataset.i)].on = cb.checked; }); }
    if(wizStep === 8){ d.partner.name = val('w-partner'); }
    if(wizStep === 9){ readNotify('w', d.notify); }
  }

  function finishWizard(){
    captureWizard();
    const d = draft;
    if(d.habits.length === 0){ wizStep = 6; render(); toast('צריך לפחות הרגל אחד'); return; }
    const start = d.startDate;
    S = emptyState();
    S.setup = {
      startDate:start, length:d.length,
      audit:d.audit, vision:d.vision, week:d.week, anti:d.anti, reasons:d.reasons,
      identity:d.identity,
      goals:d.goals,
      habits:d.habits.map(h => Object.assign({}, h, { from:start })),
      env:d.env.filter(e => e.on).map(e => ({ id:e.id, text:e.text, done:false })),
      partner:d.partner,
      notify:d.notify
    };
    const scores = {}; let any = false;
    AREAS.forEach(a => { scores[a.id] = d.audit[a.id].score; if(d.audit[a.id].score !== null) any = true; });
    if(any) S.audits.push({ id:uid(), date:today(), scores });
    draft = null;
    save();
    tick(30);
    go('today');
  }

  /* ---------- עורך הרגל ---------- */

  let habitEdit = null;
  function openHabitEditor(h, onSave){
    habitEdit = { h: h ? JSON.parse(JSON.stringify(h)) : { id:uid(), name:'', full:'', min:'', anchor:'', days:[0,1,2,3,4,5,6] }, onSave };
    const x = habitEdit.h;
    openSheet(
      '<h2>' + (x.name ? 'עריכת הרגל' : 'הרגל חדש') + '</h2>' +
      '<p class="small muted" style="margin:0 0 16px">הגדר את המינימום עכשיו, לפני שהיום הרע מגיע — כדי שלא תתווכח עם עצמך 45 דקות אם זה נחשב.</p>' +
      '<div class="field"><label for="h-name">שם</label><input type="text" id="h-name" value="' + esc(x.name) + '" placeholder="אימון / כתיבה / קריאה"></div>' +
      '<div class="field"><label for="h-full">גרסה רגילה</label><input type="text" id="h-full" value="' + esc(x.full) + '" placeholder="60 דקות בחדר כושר / 22 עמודים"></div>' +
      '<div class="field"><label for="h-min">מינימום — הרצפה ליום רע</label><div class="hint">לא גדול מדי. רצפה, לא תקן חדש.</div><input type="text" id="h-min" value="' + esc(x.min) + '" placeholder="25 דקות בבית / 5 עמודים"></div>' +
      '<div class="field"><label for="h-anchor">איפה הוא גר ביום שלך?</label><div class="hint">חבר אותו למשהו שכבר קורה. "מתישהו היום" זה המקום שבו הרגלים נעלמים.</div><input type="text" id="h-anchor" value="' + esc(x.anchor) + '" placeholder="אחרי הקפה של הבוקר"></div>' +
      '<div class="field"><label>באילו ימים</label><div class="hint">קצב שאפשר להחזיק כל העונה, לא השבוע המושלם.</div><div class="days-pick" id="h-days">' +
        DAY_SHORT.map((s, i) => '<button type="button" data-day="' + i + '" aria-pressed="' + x.days.includes(i) + '" aria-label="' + DAY_LONG[i] + '">' + s + '</button>').join('') +
      '</div></div>' +
      '<div class="row"><button class="btn btn-ghost" data-act="sheet-close">ביטול</button><button class="btn btn-primary" data-act="habit-save">שמירה</button></div>'
    );
  }
  function saveHabitFromSheet(){
    const h = habitEdit.h;
    h.name = val('h-name'); h.full = val('h-full'); h.min = val('h-min'); h.anchor = val('h-anchor');
    if(!h.name){ toast('צריך שם להרגל'); return; }
    if(!h.min){ toast('הגדר מינימום — זה מה שמציל את היום הרע'); return; }
    if(h.days.length === 0){ toast('בחר לפחות יום אחד'); return; }
    h.days.sort();
    habitEdit.onSave(h);
    habitEdit = null;
    closeSheet();
  }

  /* ---------- עורך יעד ---------- */

  let goalEdit = null;
  function openGoalEditor(g, onSave){
    goalEdit = { g: g ? Object.assign({}, g) : { id:uid(), name:'', area:'health', unit:'', actual:0, target:0 }, onSave };
    const x = goalEdit.g;
    openSheet(
      '<h2>' + (x.name ? 'עריכת יעד' : 'יעד חדש') + '</h2>' +
      '<p class="small muted" style="margin:0 0 16px">הפרד את התוצאה מההתנהגויות שמייצרות אותה. את ההתנהגויות שמים בהרגלים.</p>' +
      '<div class="field"><label for="g-name">מה מודדים</label><input type="text" id="g-name" value="' + esc(x.name) + '" placeholder="משקל / עמודים שנקראו / חיסכון"></div>' +
      '<div class="field"><label for="g-area">תחום</label><select id="g-area">' + AREAS.map(a => '<option value="' + a.id + '"' + (a.id === x.area ? ' selected' : '') + '>' + a.name + '</option>').join('') + '</select></div>' +
      '<div class="row"><div class="field"><label for="g-actual">איפה אני עכשיו</label><input type="number" step="any" inputmode="decimal" id="g-actual" value="' + esc(x.actual) + '"></div>' +
      '<div class="field"><label for="g-target">לאן בסוף העונה</label><input type="number" step="any" inputmode="decimal" id="g-target" value="' + esc(x.target) + '"></div></div>' +
      '<div class="field"><label for="g-unit">יחידה</label><input type="text" id="g-unit" value="' + esc(x.unit) + '" placeholder="ק״ג / עמודים / ₪ / שעות"></div>' +
      '<p class="small muted" id="g-pace"></p>' +
      '<div class="row"><button class="btn btn-ghost" data-act="sheet-close">ביטול</button><button class="btn btn-primary" data-act="goal-save">שמירה</button></div>'
    );
    updateGoalPace();
  }
  function readGoalSheet(){
    const g = goalEdit.g;
    g.name = val('g-name'); g.area = val('g-area'); g.unit = val('g-unit');
    g.actual = parseFloat(val('g-actual')); g.target = parseFloat(val('g-target'));
    return g;
  }
  function updateGoalPace(){
    const el = document.getElementById('g-pace');
    if(!el) return;
    const g = readGoalSheet();
    el.textContent = (isNaN(g.actual) || isNaN(g.target)) ? '' : goalPaceText(g);
  }
  function saveGoalFromSheet(){
    const g = readGoalSheet();
    if(!g.name){ toast('צריך שם ליעד'); return; }
    if(isNaN(g.actual) || isNaN(g.target)){ toast('צריך מספר התחלה ומספר יעד'); return; }
    goalEdit.onSave(g);
    goalEdit = null;
    closeSheet();
  }

  /* =========================================================
     היום
     ========================================================= */

  function renderToday(){
    const t = today();
    const s = S.setup;

    if(t < s.startDate){
      const n = diffDays(t, s.startDate);
      return '<div class="day-head"><h1>עוד ' + n + ' ' + (n === 1 ? 'יום' : 'ימים') + '</h1></div>' +
        (s.identity.who ? '<p class="identity">' + esc(s.identity.who) + '</p>' : '') +
        envCard() + exerciseCard() +
        '<div class="card"><p class="muted flush">העונה מתחילה ב' + fmtLong(s.startDate) + '. זה זמן טוב להכין את הסביבה.</p></div>';
    }

    const date = viewDate;
    const ks = keptStats();
    const dayNow = Math.min(dayIndex(t), L());
    const pct = Math.round(dayNow / L() * 100);

    let html =
      '<div class="day-head"><h1><span class="num">יום ' + dayNow + '</span> <span class="of">/ ' + L() + '</span></h1>' +
      '<div class="kept"><b class="num">' + ks.kept + '</b> ימים מתוך <span class="num">' + ks.passed + '</span></div></div>' +
      '<div class="bar" role="progressbar" aria-valuenow="' + pct + '" aria-valuemin="0" aria-valuemax="100"><i style="width:' + pct + '%"></i></div>';

    if(t > endDate()) html += finishedCard();
    if(s.identity.who) html += '<p class="identity">' + esc(s.identity.who) + '</p>';

    if(S.focusRun) html += '<div class="notice"><b>בלוק פוקוס רץ:</b> ' + esc(S.focusRun.target) + ' <button class="btn btn-primary btn-sm" style="margin-top:8px" data-act="focus-open">' + icon('timer') + ' לחזור לטיימר</button></div>';

    html +=
      '<div class="date-nav">' +
      '<button class="icon-btn" data-act="day-prev" aria-label="יום קודם"' + (date <= s.startDate ? ' disabled' : '') + '>' + icon('right') + '</button>' +
      '<div class="dn-label">' + (date === t ? 'היום · ' : '') + fmtLong(date) + ' <span class="muted small">(' + dayIndex(date) + ')</span></div>' +
      '<button class="icon-btn" data-act="day-next" aria-label="יום הבא"' + (date >= t || date >= endDate() ? ' disabled' : '') + '>' + icon('left') + '</button>' +
      '</div>';

    const prev = S.days[addDays(date, -1)];
    if(prev && prev.prep && date === t) html += '<div class="notice"><b>הכנת אתמול למחר:</b> ' + esc(prev.prep) + '</div>';

    const hs = habitsOn(date);
    if(hs.length === 0){
      html += '<div class="card"><p class="muted flush">אין הרגלים מתוכננים ליום הזה. יום מנוחה.</p></div>';
    }else{
      html += hs.map(h => {
        const m = mark(date, h.id);
        const btn = (v, label, ic) => '<button data-act="mark" data-h="' + h.id + '" data-v="' + v + '" aria-pressed="' + (m === v) + '">' + icon(ic) + label + '</button>';
        return '<div class="card habit' + (m ? ' s-' + m : '') + '">' +
          '<div class="habit-name">' + esc(h.name) + '</div>' +
          (h.anchor ? '<div class="habit-anchor">' + esc(h.anchor) + '</div>' : '') +
          '<div class="habit-versions"><span><b>רגיל:</b> ' + esc(h.full || '—') + '</span><span><b>מינימום:</b> ' + esc(h.min) + '</span></div>' +
          '<div class="tri">' + btn('full', 'רגיל', 'check') + btn('min', 'מינימום', 'half') + btn('miss', 'לא', 'x') + '</div></div>';
      }).join('');
    }

    const closed = S.days[date] && S.days[date].closed;
    html += '<div class="row"><button class="btn ' + (closed ? 'btn-ghost' : 'btn-primary') + '" data-act="close-day">' + icon('moon') + (closed ? ' לפתוח שוב' : ' סגירת יום') + '</button>' +
      (date === t && !S.focusRun ? '<button class="btn" data-act="focus-new">' + icon('timer') + ' בלוק פוקוס</button>' : '') + '</div>';

    if(date === t){
      html += goalsTodayCard() + exerciseCard() + envCard();
    }
    return html;
  }

  function goalsTodayCard(){
    const gs = S.setup.goals || [];
    if(!gs.length) return '';
    return '<div class="card" style="margin-top:16px"><h2>יעדים</h2>' + gs.map(g => {
      const cur = goalLatest(g), exp = goalExpected(g), st = goalStatus(g);
      return '<div class="goal-line"><b>' + esc(g.name) + '</b><span class="' + (st === 'on' ? '' : 'muted') + '">' + round(cur) + ' / צריך ' + round(exp) + ' ' + esc(g.unit) + '</span></div>';
    }).join('') + '<button class="btn btn-ghost btn-sm" style="width:100%" data-go="proof">לעדכן מספרים</button></div>';
  }

  function recommendedExercise(){
    return EXERCISES.find(e => !(S.ex[e.id] && S.ex[e.id].doneOn));
  }

  function exerciseCard(){
    const e = recommendedExercise();
    if(!e) return '';
    const st = S.ex[e.id] || { steps:{} };
    const done = Object.keys(st.steps || {}).filter(k => st.steps[k]).length;
    return '<div class="card accent" style="margin-top:16px"><p class="label">תרגיל השבוע</p><h2>' + esc(e.t) + '</h2><p class="small muted" style="margin:0 0 8px">' + esc(e.idea) + '</p>' +
      '<button class="btn btn-sm" style="width:100%" data-act="ex-open" data-id="' + e.id + '">' + (done ? 'להמשיך (' + done + '/' + e.steps.length + ')' : 'לפתוח') + '</button></div>';
  }

  function envCard(){
    const env = S.setup.env || [];
    if(env.every(e => e.done)) return '';
    return '<div class="card" style="margin-top:16px"><h2>הכנת הסביבה</h2>' +
      '<p class="small muted" style="margin:0 0 4px">כל אחד מאלה מוריד חיכוך. לסמן כשסידרת.</p>' +
      env.map(e => '<label class="check-row' + (e.done ? ' done' : '') + '"><input type="checkbox" data-act="env-done" data-id="' + e.id + '"' + (e.done ? ' checked' : '') + '><span>' + esc(e.text) + '</span></label>').join('') + '</div>';
  }

  function finishedCard(){
    const ks = keptStats();
    return '<div class="card" style="border-color:var(--green)"><h2>העונה הושלמה</h2>' +
      '<p style="margin:0 0 8px">עמדת ב־<b>' + ks.kept + '</b> ימים מתוך ' + ks.passed + ', ואספת <b>' + S.receipts.length + '</b> קבלות.</p>' +
      '<p class="small muted flush">תסתכל על המשפט הישן שהיית אומר על עצמך. הוא עדיין מחזיק מול כל הראיות? כדאי לעשות ביקורת מציאות חדשה ולהשוות.</p>' +
      '<button class="btn btn-ghost" data-go="proof">לראיות</button></div>';
  }

  function setMark(date, hid, v){
    if(!S.days[date]) S.days[date] = { h:{}, closed:false, prep:'' };
    const d = S.days[date];
    if(d.h[hid] === v) delete d.h[hid]; else d.h[hid] = v;
    save();
    tick(v === 'full' ? 20 : 12);
  }

  /* ---------- סגירת יום ---------- */

  function openCloseDay(date){
    const d = S.days[date] || { h:{}, closed:false, prep:'' };
    const hs = habitsOn(date);
    const unmarked = hs.filter(h => !d.h[h.id]);
    const todays = S.receipts.filter(r => r.date === date);
    openSheet(
      '<h2>סגירת יום</h2>' +
      '<p class="small muted" style="margin:0 0 16px">' + fmtLong(date) + '. עובדות, לא הרגשות. "היה יום עמוס" יכול להיות נכון — וההתחייבות עדיין פוספסה. וזה בסדר: זה רק נתון.</p>' +
      (unmarked.length
        ? '<p class="label">עוד לא סומנו</p>' + unmarked.map(h =>
            '<div class="card habit" style="padding:12px"><div class="habit-name" style="font-size:1rem;margin-bottom:8px">' + esc(h.name) + '</div><div class="tri">' +
            [['full','רגיל','check'],['min','מינימום','half'],['miss','לא','x']].map(([v,l,ic]) => '<button data-act="mark-sheet" data-date="' + date + '" data-h="' + h.id + '" data-v="' + v + '" aria-pressed="false">' + icon(ic) + l + '</button>').join('') +
            '</div></div>').join('')
        : (hs.length ? '<div class="notice good">כל ההרגלים של היום סומנו.</div>' : '')) +
      '<div class="field"><label for="c-receipt">קבלה</label><div class="hint">משהו שעשית היום שסותר את הגרסה הישנה שלך. "התאמנתי למרות שלא רציתי".</div><textarea id="c-receipt" placeholder="אפשר להשאיר ריק"></textarea></div>' +
      (todays.length ? '<p class="small muted">כבר נרשמו היום: ' + todays.map(r => esc(r.text)).join(' · ') + '</p>' : '') +
      '<div class="field"><label for="c-prep">מה תכין עכשיו כדי שמחר יהיה קל יותר?</label><input type="text" id="c-prep" value="' + esc(d.prep || '') + '" placeholder="בגדי אימון ליד המיטה"></div>' +
      '<div class="row"><button class="btn btn-ghost" data-act="sheet-close">ביטול</button><button class="btn btn-primary" data-act="close-save" data-date="' + date + '">' + icon('moon') + ' לסגור את היום</button></div>'
    );
  }

  function saveCloseDay(date){
    if(!S.days[date]) S.days[date] = { h:{}, closed:false, prep:'' };
    const d = S.days[date];
    const r = val('c-receipt');
    if(r) S.receipts.push({ id:uid(), date, text:r });
    d.prep = val('c-prep');
    d.closed = true;
    save(); closeSheet(); tick(30);
    toast('היום נסגר. מחר כבר יש תוכנית.');
    render();
  }

  /* ---------- בלוק פוקוס: מתוכנן, בפועל, דחפים, תוצר ---------- */

  let focusTimer = null;

  function suggestPlanned(){
    const last = S.focus[S.focus.length - 1];
    if(!last) return 25;
    /* עומס הדרגתי: אם עמדת בתוכנית — קצת יותר; אם לא — אותו דבר. */
    return last.actual >= last.planned ? last.planned + 5 : last.planned;
  }

  function openFocusSetup(prefill){
    openSheet(
      '<h2>בלוק פוקוס</h2>' +
      '<p class="small muted" style="margin:0 0 16px">משימה אחת עם קו סיום שרואים. טלפון בחדר אחר, שולחן נקי, מים ליד. ואז: לכתוב את היעד, חמש נשימות, ולהתחיל.</p>' +
      '<div class="field"><label for="f-target">מה זה "גמור"?</label><input type="text" id="f-target" value="' + esc(prefill || '') + '" placeholder="1,000 מילים / פרק אחד / 20 תרגילים"></div>' +
      '<div class="field"><label for="f-planned">כמה דקות</label><div class="hint">עדיף להגיד 30 ולעשות 33 מאשר להגיד 30 ולעשות שעתיים.</div><input type="number" inputmode="numeric" id="f-planned" value="' + suggestPlanned() + '"></div>' +
      '<div class="row"><button class="btn btn-ghost" data-act="sheet-close">ביטול</button><button class="btn btn-primary" data-act="focus-start">' + icon('timer') + ' להתחיל</button></div>'
    );
  }

  function startFocus(){
    const target = val('f-target');
    const planned = parseInt(val('f-planned'), 10);
    if(!target){ toast('צריך קו סיום'); return; }
    if(!planned || planned < 1){ toast('כמה דקות?'); return; }
    S.focusRun = { target, planned, start:Date.now(), urges:0 };
    save(); tick(30);
    openFocusRun();
  }

  function elapsedMin(){ return S.focusRun ? (Date.now() - S.focusRun.start) / 60000 : 0; }
  function mmss(min){ const s = Math.floor(min * 60); return pad(Math.floor(s / 60)) + ':' + pad(s % 60); }

  function openFocusRun(){
    const r = S.focusRun;
    openSheet(
      '<h2>' + esc(r.target) + '</h2>' +
      '<div class="timer num" id="f-clock">' + mmss(elapsedMin()) + '</div>' +
      '<div class="timer-sub">מתוך ' + r.planned + ' דקות</div>' +
      '<button class="urge-btn" data-act="focus-urge">דחף לברוח <span class="num" id="f-urges">' + r.urges + '</span><small>הדחף הוא תחילת העבודה — עוד 5 דקות</small></button>' +
      '<div class="row"><button class="btn btn-ghost" data-act="sheet-close">להסתיר</button><button class="btn btn-green" data-act="focus-stop">סיום</button></div>' +
      '<button class="btn btn-ghost btn-sm" style="width:100%" data-act="focus-cancel">ביטול הבלוק בלי לשמור</button>'
    );
    clearInterval(focusTimer);
    focusTimer = setInterval(() => {
      const el = document.getElementById('f-clock');
      if(!el || !S.focusRun){ clearInterval(focusTimer); return; }
      el.textContent = mmss(elapsedMin());
      if(elapsedMin() >= S.focusRun.planned && !S.focusRun.buzzed){ S.focusRun.buzzed = true; save(); tick(200); }
    }, 1000);
  }

  function stopFocus(){
    clearInterval(focusTimer);
    const r = S.focusRun;
    const actual = Math.max(1, Math.round(elapsedMin()));
    openSheet(
      '<h2>ארבעה מספרים</h2>' +
      '<p class="small muted" style="margin:0 0 16px">מדרגים את הסשן לפי מה שקרה, לא לפי איך שהוא הרגיש.</p>' +
      '<div class="row"><div class="field"><label>מתוכנן</label><input type="number" value="' + r.planned + '" disabled></div>' +
      '<div class="field"><label for="f-actual">בפועל (דק׳)</label><input type="number" inputmode="numeric" id="f-actual" value="' + actual + '"></div>' +
      '<div class="field"><label>דחפים</label><input type="number" value="' + r.urges + '" disabled></div></div>' +
      '<div class="field"><label for="f-produced">מה יצא בפועל?</label><input type="text" id="f-produced" placeholder="' + esc(r.target) + '"></div>' +
      '<div class="row"><button class="btn btn-primary" data-act="focus-save">שמירה</button></div>'
    );
  }

  function saveFocus(){
    const r = S.focusRun;
    S.focus.push({ id:uid(), date:today(), target:r.target, planned:r.planned, actual:parseInt(val('f-actual'), 10) || 0, urges:r.urges, produced:val('f-produced') });
    S.focusRun = null;
    save(); closeSheet(); tick(30);
    toast('נרשם. בפעם הבאה: ' + suggestPlanned() + ' דקות');
    render();
  }

  /* =========================================================
     ראיות — לוח, יעדים, ביקורת מציאות, פוקוס, קבלות
     ========================================================= */

  function renderProof(){
    const t = today();
    const ks = keptStats();
    const focusMin = S.focus.reduce((a, f) => a + (f.actual || 0), 0);

    let cells = '';
    for(let i = 0; i < L(); i++){
      if(i % 7 === 0) cells += '<div class="wk">שבוע ' + (i/7 + 1) + '</div>';
      const date = addDays(S.setup.startDate, i);
      let cls = date > t ? 'future' : dayStatus(date);
      if(date === t) cls += ' today';
      cells += '<button class="cell ' + cls + '" data-act="board-day" data-date="' + date + '" aria-label="' + fmtLong(date) + '">' + (i + 1) + '</button>';
    }

    const perHabit = activeHabits().map(h => {
      let f = 0, mn = 0, ms = 0;
      for(let i = 0; i < L(); i++){
        const date = addDays(S.setup.startDate, i);
        if(date > t) break;
        if(!scheduled(h, date)) continue;
        const m = mark(date, h.id);
        if(m === 'full') f++; else if(m === 'min') mn++; else if(m === 'miss') ms++;
      }
      return '<div class="list-item"><div><b>' + esc(h.name) + '</b><div class="small muted">' + esc(habitFreqText(h)) + '</div></div>' +
        '<div class="li-meta num">' + f + ' רגיל · ' + mn + ' מינ׳ · ' + ms + ' לא</div></div>';
    }).join('');

    return '<h1 class="page">ראיות</h1>' +
      '<div class="stat-grid">' +
      '<div class="stat"><b class="num">' + ks.kept + '/' + ks.passed + '</b><span>ימים שעמדת בהם</span></div>' +
      '<div class="stat"><b class="num">' + S.receipts.length + '</b><span>קבלות</span></div>' +
      '<div class="stat"><b class="num">' + S.focus.length + '</b><span>בלוקי פוקוס</span></div>' +
      '<div class="stat"><b class="num">' + Math.round(focusMin / 60 * 10) / 10 + '</b><span>שעות פוקוס</span></div></div>' +
      renderGoals() +
      receiptsCard() +
      '<div class="card"><h2>הלוח</h2><div class="board">' + cells + '</div>' +
      '<div class="legend"><span><i style="background:var(--green)"></i>הכול רגיל</span><span><i style="background:var(--amber)"></i>עמדת (עם מינימום)</span>' +
      '<span><i style="background:var(--hatch)"></i>פוספס</span><span><i style="border:1px solid var(--muted)"></i>לא סומן</span><span><i style="border:1px solid var(--line)"></i>מנוחה</span></div></div>' +
      (perHabit ? '<div class="card"><h2>לפי הרגל</h2>' + perHabit + '</div>' : '') +
      auditCard() +
      focusCard();
  }

  function renderGoals(){
    const gs = S.setup.goals || [];
    if(!gs.length) return '<div class="card"><h2>יעדים במספרים</h2><p class="small muted flush">אין יעדים. אפשר להוסיף במסך "תוכנית".</p></div>';
    return gs.map(g => {
      const log = S.goalLog.filter(x => x.goalId === g.id).sort((a,b) => a.date.localeCompare(b.date));
      const cur = goalLatest(g), exp = goalExpected(g), st = goalStatus(g);
      const span = g.target - g.actual;
      const pctDone = span ? Math.max(0, Math.min(100, (cur - g.actual) / span * 100)) : 100;
      const pctExp = span ? Math.max(0, Math.min(100, (exp - g.actual) / span * 100)) : 100;
      const weekEnd = weekRange(currentWeek())[1];
      return '<div class="card"><h2>' + esc(g.name) + '<span class="tag">' + esc((AREAS.find(a => a.id === g.area) || {}).name || '') + '</span></h2>' +
        '<div class="goal-line"><span>עכשיו: <b class="num">' + round(cur) + '</b> ' + esc(g.unit) + '</span><span class="muted">יעד: ' + round(g.target) + '</span></div>' +
        '<div class="goal-bar" aria-hidden="true"><i style="width:' + pctDone + '%"></i><u style="right:calc(' + pctExp + '% - 1px)"></u></div>' +
        '<div class="goal-line small"><span class="' + (st === 'on' ? '' : 'muted') + '">' + (st === 'on' ? 'בקצב' : 'מאחורי הקצב') + ' · היום צריך להיות ' + round(exp) + '</span><span class="muted">סוף השבוע: ' + round(goalExpected(g, weekEnd)) + '</span></div>' +
        '<p class="small muted" style="margin:4px 0 0">' + goalPaceText(g) + '</p>' +
        sparkline(g, log) +
        '<div class="row" style="align-items:flex-end"><div class="field" style="flex:2;margin:0"><label for="gv-' + g.id + '">ערך עדכני</label><input type="number" step="any" inputmode="decimal" id="gv-' + g.id + '"></div>' +
        '<button class="btn btn-primary" style="flex:1;margin:0" data-act="goal-log" data-id="' + g.id + '">' + icon('plus') + ' רישום</button></div>' +
        (log.length ? '<details style="margin-top:12px"><summary>כל הערכים (' + log.length + ')</summary>' +
          log.slice().reverse().map(x => '<div class="list-item"><span class="num">' + x.value + ' ' + esc(g.unit) + '</span><span class="li-meta">' + fmt(x.date) +
          '<button class="icon-btn sm" data-act="goal-log-del" data-id="' + x.id + '" aria-label="מחיקה">' + icon('trash') + '</button></span></div>').join('') + '</details>' : '') +
        '<p class="small muted" style="margin:8px 0 0">מספר זז מסיבות שלא קשורות לתוכנית (משקל, הכנסה לא אחידה). לא להגיב לכל נקודה — להסתכל על המגמה.</p>' +
        '</div>';
    }).join('');
  }

  /* קו הקצב המתוכנן (מקווקו) מול הערכים בפועל. מצויר משמאל לימין כמו כל ציר זמן. */
  function sparkline(g, log){
    const pts = [{ i:0, v:g.actual }].concat(log.map(x => ({ i:Math.max(0, dayIndex(x.date)), v:x.value })));
    if(pts.length < 2) return '';
    const vals = pts.map(p => p.v).concat([g.target]);
    const min = Math.min.apply(null, vals), max = Math.max.apply(null, vals), span = max - min || 1;
    const W = 300, H = 64, P = 6;
    const X = i => P + (i / L()) * (W - 2*P);
    const Y = v => H - P - ((v - min) / span) * (H - 2*P);
    const poly = pts.map(p => Math.round(X(p.i)*10)/10 + ',' + Math.round(Y(p.v)*10)/10).join(' ');
    const last = pts[pts.length - 1];
    return '<svg class="spark" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" aria-hidden="true">' +
      '<line x1="' + X(0) + '" y1="' + Y(g.actual) + '" x2="' + X(L()) + '" y2="' + Y(g.target) + '"/>' +
      '<polyline points="' + poly + '"/><circle cx="' + X(last.i) + '" cy="' + Y(last.v) + '" r="4"/></svg>';
  }

  function receiptsCard(){
    const list = S.receipts.slice().sort((a,b) => b.date.localeCompare(a.date));
    return '<div class="card"><h2>קבלות</h2>' +

      '<div class="field" style="margin-bottom:0"><textarea id="r-new" placeholder="סיימתי את הפרק במקום לנטוש באמצע"></textarea></div>' +
      '<button class="btn btn-primary" data-act="receipt-add">' + icon('plus') + ' קבלה</button>' +
      (list.length ? '<details style="margin-top:12px"' + (list.length <= 5 ? ' open' : '') + '><summary>כל הקבלות (' + list.length + ')</summary>' + list.map(r =>
        '<div class="list-item"><div>' + esc(r.text) + '</div><div class="li-meta">' + (inRange(r.date) ? 'יום ' + dayIndex(r.date) + ' · ' : '') + fmt(r.date) +
        '<button class="icon-btn sm" data-act="receipt-del" data-id="' + r.id + '" aria-label="מחיקה">' + icon('trash') + '</button></div></div>').join('') + '</details>' : '') +
      '</div>';
  }

  function auditCard(){
    const first = S.audits[0], last = S.audits[S.audits.length - 1];
    let rows = '';
    if(first){
      rows = AREAS.map(a => {
        const f = first.scores[a.id], l = last.scores[a.id];
        return '<div class="audit-row"><span class="an">' + a.name + '</span><span class="ab"><u style="width:' + ((f || 0) * 10) + '%"></u><i style="width:' + ((l || 0) * 10) + '%;opacity:' + (S.audits.length > 1 ? 1 : 0.9) + '"></i></span>' +
          '<span class="av num">' + (f === null ? '—' : f) + (S.audits.length > 1 ? ' → ' + (l === null ? '—' : l) : '') + '</span></div>';

    return '<div class="card"><h2>ביקורת מציאות</h2>' +

             : '<p class="small muted flush">עוד לא נעשתה.</p>') +
      '<button class="btn btn-sm" style="width:100%" data-act="audit-new">ציון חדש (כדאי כל 30 יום)</button></div>';
  }

  function openAudit(){

    openSheet('<h2>ביקורת מציאות</h2><p class="small muted" style="margin:0 0 16px">לפי המציאות של עכשיו — לא לפי מי שאתה מצפה להיות.</p>' +
      AREAS.map(a => '<div class="field"><label>' + a.name + (last && last.scores[a.id] !== null ? ' <span class="muted small">(קודם: ' + last.scores[a.id] + ')</span>' : '') + '</label><div class="score" data-area="' + a.id + '">' +
        Array.from({length:11}, (_, i) => '<button type="button" data-score="' + i + '" aria-pressed="false" aria-label="' + i + '">' + i + '</button>').join('') + '</div></div>').join('') +
      '<div class="row"><button class="btn btn-ghost" data-act="sheet-close">ביטול</button><button class="btn btn-primary" data-act="audit-save">שמירה</button></div>');

  function focusCard(){
    if(!S.focus.length) return '<div class="card"><h2>פוקוס</h2><p class="small muted flush">עוד אין בלוקים. מתחילים מהמסך "היום".</p></div>';
    const list = S.focus.slice().reverse();
    return '<div class="card"><h2>פוקוס</h2><p class="small muted" style="margin:0 0 4px">מתוכנן / בפועל / דחפים</p>' +
      list.slice(0, 12).map(f => '<div class="list-item"><div><b>' + esc(f.target) + '</b>' + (f.produced ? '<div class="small muted">' + esc(f.produced) + '</div>' : '') + '</div>' +

  function renderExercises(){

  /* =========================================================
     סקירה שבועית — לולאת המשוב
     ========================================================= */

  function weekStats(w){
    const [a, b] = weekRange(w);
    const t = today();
    const rows = habits().filter(h => { for(let d = a; d <= b; d = addDays(d, 1)) if(scheduled(h, d)) return true; return false; }).map(h => {
      let planned = 0, f = 0, mn = 0, ms = 0; const missDays = [], cells = [];
      for(let d = a; d <= b; d = addDays(d, 1)){
        if(!scheduled(h, d)){ cells.push('rest'); continue; }
        planned++;
        if(d > t){ cells.push('rest'); continue; }
        const m = mark(d, h.id);
        if(m === 'full'){ f++; cells.push('full'); }
        else if(m === 'min'){ mn++; cells.push('min'); }
        else if(m === 'miss'){ ms++; missDays.push(d); cells.push('miss'); }
        else { missDays.push(d); cells.push('none'); }
      }
      return { h, planned, f, mn, ms, missDays, cells };
    });
    const receipts = S.receipts.filter(r => r.date >= a && r.date <= b);
    const focus = S.focus.filter(x => x.date >= a && x.date <= b);
    return { a, b, rows, receipts, focus };
  }

  const EXEC_REASONS = ['שעה לא נכונה','המינימום גדול מדי','יותר מדי חיכוך / הסביבה','הסחות','לא באמת רציתי'];

  function renderReview(){
    if(reviewWeek === null) reviewWeek = currentWeek();
    const w = reviewWeek;
    const maxW = Math.ceil(L() / 7);
    const st = weekStats(w);
    const dates = []; for(let d = st.a; d <= st.b; d = addDays(d, 1)) dates.push(d);
    const table = '<table class="wtable"><thead><tr><th></th>' + dates.map(d => '<th>' + DAY_SHORT[weekday(d)] + '<br><span class="num">' + fmt(d) + '</span></th>').join('') + '</tr></thead><tbody>' +
      st.rows.map(r => '<tr><td class="hn">' + esc(r.h.name) + '</td>' + r.cells.map(c => '<td><span class="dot ' + c + '"></span></td>').join('') + '</tr>').join('') + '</tbody></table>';

    const saved = S.weekly.find(x => x.week === w) || { well:'', broke:'', cause:'', reasons:[], bottleneck:'', fix:'' };
    const gs = S.setup.goals || [];

    return '<h1 class="page">סקירה שבועית</h1>' +
      '<div class="date-nav">' +
      '<button class="icon-btn" data-act="week-prev" aria-label="שבוע קודם"' + (w <= 1 ? ' disabled' : '') + '>' + icon('right') + '</button>' +
      '<div class="dn-label">שבוע ' + w + ' <span class="muted small">(' + fmt(st.a) + '–' + fmt(st.b) + ')</span></div>' +
      '<button class="icon-btn" data-act="week-next" aria-label="שבוע הבא"' + (w >= Math.min(maxW, currentWeek()) ? ' disabled' : '') + '>' + icon('left') + '</button></div>' +
      '<div class="card">' + table +
      '<div class="legend"><span><i style="background:var(--green)"></i>רגיל</span><span><i style="background:var(--amber)"></i>מינימום</span><span><i style="background:var(--hatch)"></i>לא</span><span><i style="border:1px dashed var(--muted)"></i>לא סומן</span></div>' +
      '<p class="small muted" style="margin:12px 0 0">' + st.receipts.length + ' קבלות · ' + st.focus.length + ' בלוקי פוקוס השבוע</p></div>' +
      (gs.length ? '<div class="card"><h2>המספרים</h2>' + gs.map(g => '<div class="goal-line"><b>' + esc(g.name) + '</b><span>' + round(goalLatest(g)) + ' / צריך ' + round(goalExpected(g, st.b)) + ' ' + esc(g.unit) + '</span></div>').join('') + '</div>' : '') +
      patternCard() +
      '<div class="card"><h2>אבחון</h2>' +
      '<p class="small muted" style="margin:0 0 12px">להסתכל על השבוע כולו, לא על כל יום בנפרד. פספסת אימון אקראי אחד — או כל אימון אחרי 18:00?</p>' +
      '<div class="field"><label for="rv-well">איפה זה עבד?</label><textarea id="rv-well">' + esc(saved.well) + '</textarea></div>' +
      '<div class="field"><label for="rv-broke">איפה זה נשבר?</label><textarea id="rv-broke">' + esc(saved.broke) + '</textarea></div>' +
      '<div class="field"><label>איזו בעיה זו?</label><div class="chips" id="rv-cause">' +
        '<button type="button" class="chip" data-cause="exec" aria-pressed="' + (saved.cause === 'exec') + '">ביצוע — לא עשיתי את התוכנית</button>' +
        '<button type="button" class="chip" data-cause="strategy" aria-pressed="' + (saved.cause === 'strategy') + '">אסטרטגיה — עשיתי, והתוצאה לא זזה</button>' +
        '<button type="button" class="chip" data-cause="none" aria-pressed="' + (saved.cause === 'none') + '">אין בעיה — להמשיך</button>' +
      '</div></div>' +
      '<div class="field" id="rv-exec"' + (saved.cause === 'exec' ? '' : ' hidden') + '><label>מה מנע ביצוע?</label><div class="hint">כשהתוכנית היא 5 אימונים ועשית 2 — התוכנית לא נכשלה. מתקנים קודם את הביצוע.</div><div class="chips" id="rv-reasons">' +
        EXEC_REASONS.map(r => '<button type="button" class="chip" data-reason="' + esc(r) + '" aria-pressed="' + (saved.reasons || []).includes(r) + '">' + esc(r) + '</button>').join('') + '</div></div>' +
      '<div class="field" id="rv-strat"' + (saved.cause === 'strategy' ? '' : ' hidden') + '><label for="rv-bottle">איפה צוואר הבקבוק?</label><div class="hint">ללכת אחורה בשרשרת (הכנסה ← מכירות ← שיחות ← פניות) עד המספר הראשון שלא מתנהג כמו שצריך. לתקן רק אותו.</div><input type="text" id="rv-bottle" value="' + esc(saved.bottleneck || '') + '"></div>' +
      '<div class="field"><label for="rv-fix">מה משנים לשבוע הבא?</label><div class="hint">לשמור מה שעובד, לתקן מה שלא. אפשר לערוך הרגלים ויעדים ב"תוכנית".</div><input type="text" id="rv-fix" value="' + esc(saved.fix) + '"></div>' +
      '<button class="btn btn-primary" data-act="review-save">שמירת הסקירה</button></div>' +
      updateCard(w, st, saved);
  }

  function patternCard(){
    const t = today();
    if(dayIndex(t) < 14) return '';
    const planned = [0,0,0,0,0,0,0], missed = [0,0,0,0,0,0,0];
    for(let i = 0; i < L(); i++){
      const date = addDays(S.setup.startDate, i);
      if(date >= t) break;
      habitsOn(date).forEach(h => {
        const wd = weekday(date);
        planned[wd]++;
        const m = mark(date, h.id);
        if(m !== 'full' && m !== 'min') missed[wd]++;
      });
    }
    const rows = DAY_LONG.map((name, i) => {
      if(!planned[i]) return '';
      const p = Math.round(missed[i] / planned[i] * 100);
      return '<div class="pattern-row"><span class="pd">' + name + '</span><span class="pb"><i style="width:' + p + '%"></i></span><span class="pv num">' + p + '%</span></div>';
    }).join('');
    return '<div class="card"><h2>איפה זה נופל</h2><p class="small muted" style="margin:0 0 8px">אחוז ההרגלים שלא בוצעו, לפי יום בשבוע, מתחילת העונה.</p>' + rows + '</div>';
  }

  function updateText(w, st, saved){
    const lines = ['עדכון — שבוע ' + w + ' (' + fmt(st.a) + '–' + fmt(st.b) + ')', '', 'אמרתי:'];
    st.rows.forEach(r => lines.push('• ' + r.h.name + ' — ' + habitFreqText(r.h) + (r.h.full ? ' (' + r.h.full + ')' : '')));
    lines.push('', 'עשיתי:');
    st.rows.forEach(r => lines.push('• ' + r.h.name + ': ' + (r.f + r.mn) + ' מתוך ' + r.planned + (r.mn ? ' (' + r.mn + ' במינימום)' : '')));
    (S.setup.goals || []).forEach(g => lines.push('• ' + g.name + ': ' + round(goalLatest(g)) + ' ' + g.unit + ' (יעד לשבוע: ' + round(goalExpected(g, st.b)) + ')'));
    const misses = [];
    st.rows.forEach(r => r.missDays.forEach(d => misses.push(r.h.name + ' ביום ' + DAY_LONG[weekday(d)])));
    lines.push('', 'פספסתי: ' + (misses.length ? misses.join(', ') : 'כלום'));
    if(saved.fix) lines.push('', 'משנה לשבוע הבא: ' + saved.fix);
    return lines.join('\n');
  }

  function updateCard(w, st, saved){
    const name = S.setup.partner && S.setup.partner.name;
    return '<div class="card"><h2>עדכון ל' + (name ? esc(name) : 'אדם אחד') + '</h2>' +
      '<p class="small muted" style="margin:0 0 8px">שתי דקות. הנקודה היא שיהיה קשה לשנות את הכללים בשקט באמצע.</p>' +
      '<div class="update-box" id="update-text">' + esc(updateText(w, st, saved)) + '</div>' +
      '<div class="row"><button class="btn" data-act="update-copy">' + icon('copy') + ' העתקה</button>' +
      (navigator.share ? '<button class="btn" data-act="update-share">' + icon('share') + ' שליחה</button>' : '') + '</div></div>';
  }

  function saveReview(){
    const w = reviewWeek;
    const c = document.querySelector('#rv-cause [aria-pressed="true"]');
    const cause = c ? c.dataset.cause : '';
    const rec = {
      id:uid(), week:w, well:val('rv-well'), broke:val('rv-broke'), cause,
      reasons: cause === 'exec' ? Array.from(document.querySelectorAll('#rv-reasons [aria-pressed="true"]')).map(b => b.dataset.reason) : [],
      bottleneck: cause === 'strategy' ? val('rv-bottle') : '',
      fix:val('rv-fix'), ts:new Date().toISOString()
    };
    const i = S.weekly.findIndex(x => x.week === w);
    if(i >= 0){ rec.id = S.weekly[i].id; S.weekly[i] = rec; } else S.weekly.push(rec);
    save(); tick(20); toast('הסקירה נשמרה'); render();
  }

  /* =========================================================
     תוכנית — לקרוא שוב את הלמה, ולערוך הכול
     ========================================================= */

  function renderPlan(){
    const s = S.setup;
    const n = s.notify;
    const vis = AREAS.filter(a => s.vision[a.id]).map(a => '<p class="label" style="margin:12px 0 4px">' + a.name + '</p><div class="quote want">' + nl(s.vision[a.id]) + '</div>').join('');
    return '<h1 class="page">תוכנית</h1>' +

      '<div class="card"><h2>למה</h2>' +
