  /* =========================================================
     התראות (Web Push)
     ========================================================= */

  function isIOS(){ return /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); }
  function isStandalone(){ return window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true; }
  function pushSupported(){ return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window; }

  function pushStatusText(){
    if(!pushSupported()){
      return isIOS() && !isStandalone()
        ? 'באייפון: קודם להוסיף למסך הבית (שיתוף ← הוספה למסך הבית), ואז לפתוח מהאייקון ולהפעיל מכאן.'
        : 'הדפדפן הזה לא תומך בהתראות.';
    }
    if(Notification.permission === 'denied') return 'ההתראות חסומות בהגדרות הטלפון. צריך לאפשר אותן שם.';
    return S.setup.notify.on ? 'פעיל. אחרי שינוי שעות — "שמירת שעות".' : 'כבוי.';
  }

  function b64ToBytes(b64){
    const s = (b64 + '='.repeat((4 - b64.length % 4) % 4)).replace(/-/g,'+').replace(/_/g,'/');
    return Uint8Array.from(atob(s), c => c.charCodeAt(0));
  }

  async function pushOn(){
    readNotify('s', S.setup.notify);
    save();
    if(!pushSupported()){ toast(pushStatusText()); return; }
    try{
      const perm = await Notification.requestPermission();
      if(perm !== 'granted'){ toast('לא אושרו התראות'); render(); return; }
      const reg = await navigator.serviceWorker.ready;
      let sub = await reg.pushManager.getSubscription();
      if(!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey:b64ToBytes(VAPID_PUBLIC) });
      const n = S.setup.notify;
      const res = await fetch(PUSH_URL + '/subscribe', {
        method:'POST', headers:{ 'Content-Type':'application/json' },
        body: JSON.stringify({ sub:sub.toJSON(), sched:{ morning:n.morning, evening:n.evening, weeklyDay:n.weeklyDay, weeklyTime:n.weeklyTime }, tz:Intl.DateTimeFormat().resolvedOptions().timeZone })
      });
      if(!res.ok) throw new Error('server ' + res.status);
      n.on = true; save(); tick(25); toast('ההתראות פעילות');
    }catch(e){ toast('ההפעלה נכשלה — נסה שוב'); }
    render();
  }

  async function pushOff(){
    try{
      const reg = await navigator.serviceWorker.ready;
      const sub = await reg.pushManager.getSubscription();
      if(sub){
        await fetch(PUSH_URL + '/unsubscribe', { method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify({ endpoint:sub.endpoint }) }).catch(() => {});
        await sub.unsubscribe();
      }
    }catch(e){}
    if(S.setup){ S.setup.notify.on = false; save(); }
    toast('ההתראות כובו');
    render();
  }

  async function pushTest(){
    try{
      const reg = await navigator.serviceWorker.ready;
      const sub = await reg.pushManager.getSubscription();
      if(!sub){ toast('אין מנוי — להפעיל מחדש'); return; }
      const res = await fetch(PUSH_URL + '/test', { method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify({ endpoint:sub.endpoint }) });
      const j = await res.json();
      toast(j.ok ? 'נשלחה התראת בדיקה' : 'הבדיקה נכשלה (' + (j.status || j.error) + ')');
    }catch(e){ toast('הבדיקה נכשלה'); }
  }

  /* ה־service worker לא רואה localStorage — מקבל את השעות והטקסטים דרך Cache. */

  /* =========================================================
     גיבוי / שחזור
     ========================================================= */

  function b64EncodeUnicode(str){
    const bytes = new TextEncoder().encode(str);
    let bin = '';
    for(let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  }
  function b64DecodeUnicode(b64){
    let s = b64.replace(/-/g,'+').replace(/_/g,'/');
    while(s.length % 4) s += '=';
    return new TextDecoder().decode(Uint8Array.from(atob(s), c => c.charCodeAt(0)));
  }

  async function copy(text){
    try{ await navigator.clipboard.writeText(text); return true; }
    catch(e){
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      let ok = false; try{ ok = document.execCommand('copy'); }catch(err){}
      document.body.removeChild(ta);
      return ok;
    }
  }

  async function backup(){
    const link = location.origin + location.pathname + '#restore=' + b64EncodeUnicode(JSON.stringify(S));
    if(navigator.share){ try{ await navigator.share({ title:'גיבוי 90 יום', url:link }); toast('הגיבוי נשלח'); return; }catch(e){} }
    toast((await copy(link)) ? 'קישור הגיבוי הועתק' : 'ההעתקה נכשלה');
  }

  /* מכשיר ריק — לוקחים הכול. מכשיר עם נתונים — מוסיפים רק מה שחסר, בלי לגעת בתוכנית. */
  function importData(data){
    if(!data || typeof data !== 'object' || !('days' in data)) return 'invalid';
    if(!S.setup){
      if(!confirm('לייבא את הגיבוי?')) return 'cancelled';
      S = Object.assign(emptyState(), data);
    }else{
      const newDays = Object.keys(data.days || {}).filter(k => !S.days[k]);
      const merge = key => { const have = new Set((S[key] || []).map(x => x.id)); const add = (data[key] || []).filter(x => !have.has(x.id)); S[key] = (S[key] || []).concat(add); return add.length; };
      const before = JSON.stringify(S);
      newDays.forEach(k => { S.days[k] = data.days[k]; });
      const n = newDays.length + merge('receipts') + merge('goalLog') + merge('weekly') + merge('focus') + merge('audits');
      if(n === 0) return 'empty';
      if(!confirm('נמצאו ' + n + ' רשומות חדשות (ימים, קבלות, מדידות, סקירות). להוסיף?')){ S = JSON.parse(before); return 'cancelled'; }
    }
    save(); tick(25); go('today');
    return 'ok';
  }

  function openImport(){
    openSheet('<h2>ייבוא גיבוי</h2>' +
      '<p class="small muted" style="margin:0 0 12px">להדביק כאן את הקישור או הקוד. באייפון — בתוך האפליקציה שנפתחה מהאייקון, לא ב־Safari.</p>' +
      '<div class="field"><textarea id="imp" style="direction:ltr;text-align:left;font-size:0.8rem" placeholder="https://...#restore=..."></textarea></div>' +
      '<div class="row"><button class="btn btn-ghost" data-act="sheet-close">ביטול</button><button class="btn btn-primary" data-act="import-go">ייבוא</button></div>');
  }
  function doImport(){
    const text = val('imp');
    const m = text.match(/restore=([^\s&]+)/);
    const payload = m ? m[1] : text;
    if(!payload) return;
    let data;
    try{ data = JSON.parse(b64DecodeUnicode(payload)); }catch(e){ toast('לא הצלחתי לקרוא את הקוד'); return; }
    const r = importData(data);
    if(r === 'invalid') toast('הקוד לא תקין');
    else if(r === 'empty'){ toast('אין שום דבר חדש בגיבוי'); closeSheet(); }
    else if(r === 'ok') closeSheet();
  }
  function checkRestoreHash(){
    const m = location.hash.match(/^#restore=(.+)$/);
    if(!m) return;
    history.replaceState(null, '', location.pathname + location.search);
    try{ importData(JSON.parse(b64DecodeUnicode(m[1]))); }catch(e){}
  }

  /* =========================================================
     אירועים
     ========================================================= */

  function pressOne(container, btn){
    container.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b === btn)));
    tick(8);
  }

  document.addEventListener('click', async (e) => {
    const goBtn = e.target.closest('[data-go]');
    if(goBtn){ closeSheet(); go(goBtn.dataset.go); return; }
    if(e.target.id === 'sheet'){ closeSheet(); render(); return; }

    const lenBtn = e.target.closest('#w-len [data-len]');
    if(lenBtn){ pressOne(lenBtn.parentElement, lenBtn); draft.length = Number(lenBtn.dataset.len); return; }

    const scoreBtn = e.target.closest('.score [data-score]');
    if(scoreBtn){
      const box = scoreBtn.parentElement;
      pressOne(box, scoreBtn);
      if(draft && !S.setup) draft.audit[box.dataset.area].score = Number(scoreBtn.dataset.score);
      return;
    }

    const dayBtn = e.target.closest('#h-days [data-day]');
    if(dayBtn){
      const d = Number(dayBtn.dataset.day), arr = habitEdit.h.days, i = arr.indexOf(d);
      if(i >= 0) arr.splice(i, 1); else arr.push(d);
      dayBtn.setAttribute('aria-pressed', String(i < 0));
      tick(8);
      return;
    }
    const causeBtn = e.target.closest('#rv-cause [data-cause]');
    if(causeBtn){
      pressOne(causeBtn.parentElement, causeBtn);
      document.getElementById('rv-exec').hidden = causeBtn.dataset.cause !== 'exec';
      document.getElementById('rv-strat').hidden = causeBtn.dataset.cause !== 'strategy';
      return;
    }
    const reasonBtn = e.target.closest('#rv-reasons [data-reason]');
    if(reasonBtn){ reasonBtn.setAttribute('aria-pressed', String(reasonBtn.getAttribute('aria-pressed') !== 'true')); tick(8); return; }

    const el = e.target.closest('[data-act]');
    if(!el) return;
    const act = el.dataset.act;

    switch(act){
      /* --- wizard --- */
      case 'wiz-next':
        captureWizard();
        if(wizStep === 6 && draft.habits.length === 0){ toast('צריך לפחות הרגל אחד'); return; }
        wizStep++; render(); window.scrollTo(0,0); break;
      case 'wiz-back': captureWizard(); wizStep--; render(); window.scrollTo(0,0); break;
      case 'wiz-finish': finishWizard(); break;
      case 'add-habit': openHabitEditor(null, h => { draft.habits.push(h); render(); }); break;
      case 'wiz-edit-habit': { const i = Number(el.dataset.i); openHabitEditor(draft.habits[i], h => { draft.habits[i] = h; render(); }); break; }
      case 'wiz-del-habit': draft.habits.splice(Number(el.dataset.i), 1); render(); break;
      case 'wiz-add-goal': openGoalEditor(null, g => { draft.goals.push(g); render(); }); break;
      case 'wiz-edit-goal': { const i = Number(el.dataset.i); openGoalEditor(draft.goals[i], g => { draft.goals[i] = g; render(); }); break; }
      case 'wiz-del-goal': draft.goals.splice(Number(el.dataset.i), 1); render(); break;
      case 'wiz-env-add': { captureWizard(); const t = val('w-env-new'); if(t){ draft.env.push({ id:uid(), text:t, on:true, done:false }); render(); } break; }

      /* --- sheets --- */
      case 'habit-save': saveHabitFromSheet(); break;
      case 'goal-save': saveGoalFromSheet(); break;
      case 'sheet-close': closeSheet(); render(); break;

      /* --- today --- */
      case 'mark': setMark(viewDate, el.dataset.h, el.dataset.v); render(); break;
      case 'mark-sheet':
        setMark(el.dataset.date, el.dataset.h, el.dataset.v);
        el.parentElement.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b === el && mark(el.dataset.date, el.dataset.h) === el.dataset.v)));
        break;
      case 'day-prev': viewDate = clampDate(addDays(viewDate, -1)); render(); break;
      case 'day-next': { const n = addDays(viewDate, 1); if(n <= today()) viewDate = clampDate(n); render(); break; }
      case 'close-day': openCloseDay(viewDate); break;
      case 'close-save': saveCloseDay(el.dataset.date); break;
      case 'env-done': { const env = S.setup.env.find(x => x.id === el.dataset.id); if(env){ env.done = el.checked; save(); tick(15); setTimeout(render, 250); } break; }

      /* --- focus --- */
      case 'focus-new': openFocusSetup(''); break;
      case 'focus-start': startFocus(); break;
      case 'focus-open': openFocusRun(); break;
      case 'focus-urge': S.focusRun.urges++; save(); tick(40); document.getElementById('f-urges').textContent = S.focusRun.urges; break;
      case 'focus-stop': stopFocus(); break;
      case 'focus-save': saveFocus(); break;
      case 'focus-cancel': if(confirm('לבטל את הבלוק בלי לשמור?')){ S.focusRun = null; save(); closeSheet(); render(); } break;

      /* --- proof --- */
      case 'board-day': { const d = el.dataset.date; if(d <= today()){ viewDate = d; view = 'today'; render(); window.scrollTo(0,0); } break; }
      case 'goal-log': {
        const inp = document.getElementById('gv-' + el.dataset.id);
        const v = inp ? parseFloat(inp.value) : NaN;
        if(isNaN(v)){ toast('צריך מספר'); return; }
        S.goalLog.push({ id:uid(), date:today(), goalId:el.dataset.id, value:v });
        save(); tick(20); render();
        break;
      }
      case 'goal-log-del': if(confirm('למחוק את הערך?')){ S.goalLog = S.goalLog.filter(x => x.id !== el.dataset.id); save(); render(); } break;
      case 'receipt-add': { const t = val('r-new'); if(!t) return; S.receipts.push({ id:uid(), date:today(), text:t }); save(); tick(25); toast('עוד קבלה על הלוח'); render(); break; }
      case 'receipt-del': if(confirm('למחוק את הקבלה?')){ S.receipts = S.receipts.filter(x => x.id !== el.dataset.id); save(); render(); } break;
      case 'audit-new': openAudit(); break;
      case 'audit-save': {
        const scores = {}; let any = false;
        AREAS.forEach(a => { const b = document.querySelector('.score[data-area="' + a.id + '"] [aria-pressed="true"]'); scores[a.id] = b ? Number(b.dataset.score) : null; if(b) any = true; });
        if(!any){ toast('לבחור לפחות ציון אחד'); return; }
        S.audits.push({ id:uid(), date:today(), scores }); save(); closeSheet(); render();
        break;
      }

      /* --- exercises --- */
      case 'ex-open': openExercise(el.dataset.id); break;
      case 'ex-step': {
        const st = exState(el.dataset.id);
        st.steps[el.dataset.i] = el.checked;
        const ex = EXERCISES.find(x => x.id === el.dataset.id);
        const all = ex.steps.every((_, i) => st.steps[i]);
        st.doneOn = all ? (st.doneOn || today()) : null;
        el.closest('.check-row').classList.toggle('done', el.checked);
        save(); tick(15);
        if(all) toast('התרגיל הושלם');
        break;
      }
      case 'ex-count': {
        const st = exState(el.dataset.id);
        const i = el.dataset.i;
        st.counts[i] = Math.max(0, (st.counts[i] || 0) + Number(el.dataset.d));
        document.getElementById('cnt-' + i).textContent = st.counts[i];
        save(); tick(10);
        break;
      }
      case 'ex-habit': {
        saveExNotes();
        const name = el.dataset.name;
        openHabitEditor({ id:uid(), name, full:'', min:'', anchor:'', days:[0,1,2,3,4,5,6] }, h => {
          h.from = today() < S.setup.startDate ? S.setup.startDate : today();
          S.setup.habits.push(h); save(); toast('נוסף להרגלים'); render();
        });
        break;
      }
      case 'ex-focus': saveExNotes(); openFocusSetup(''); break;
      case 'ex-receipt': saveExNotes(); closeSheet(); go('proof'); setTimeout(() => { const r = document.getElementById('r-new'); if(r) r.focus(); }, 100); break;
      case 'ex-close': closeSheet(); render(); break;

      /* --- review --- */
      case 'week-prev': reviewWeek = Math.max(1, reviewWeek - 1); render(); break;
      case 'week-next': reviewWeek = Math.min(currentWeek(), reviewWeek + 1); render(); break;
      case 'review-save': saveReview(); break;
      case 'update-copy': { const ok = await copy(document.getElementById('update-text').textContent); toast(ok ? 'הועתק' : 'ההעתקה נכשלה'); break; }
      case 'update-share': try{ await navigator.share({ text:document.getElementById('update-text').textContent }); }catch(err){} break;

      /* --- plan --- */
      case 'edit-why': openEditWhy(); break;
      case 'save-why': { const s = S.setup; s.reasons.want = val('e-want'); s.reasons.refuse = val('e-refuse'); s.anti = val('e-anti'); s.reasons.here = val('e-here'); save(); closeSheet(); render(); break; }
      case 'edit-vision': openEditVision(); break;
      case 'save-vision': { const s = S.setup; AREAS.forEach(a => { s.vision[a.id] = val('e-vi-' + a.id); }); s.week = val('e-week'); save(); closeSheet(); render(); break; }
      case 'edit-identity': openEditIdentity(); break;
      case 'save-identity': S.setup.identity = { who:val('e-who'), day:val('e-day'), stop:val('e-stop'), seen:val('e-seen') }; save(); closeSheet(); render(); break;
      case 'goal-new': openGoalEditor(null, g => { S.setup.goals.push(g); save(); render(); }); break;
      case 'goal-edit': { const g = S.setup.goals.find(x => x.id === el.dataset.id); openGoalEditor(g, ng => { Object.assign(g, ng); save(); render(); }); break; }
      case 'goal-remove':
        if(!confirm('להסיר את היעד וכל הערכים שלו?')) return;
        S.setup.goals = S.setup.goals.filter(x => x.id !== el.dataset.id);
        S.goalLog = S.goalLog.filter(x => x.goalId !== el.dataset.id);
        save(); render();
        break;
      case 'habit-new': openHabitEditor(null, h => { h.from = today() < S.setup.startDate ? S.setup.startDate : today(); S.setup.habits.push(h); save(); render(); }); break;
      case 'habit-edit': { const h = S.setup.habits.find(x => x.id === el.dataset.id); openHabitEditor(h, nh => { Object.assign(h, nh); save(); render(); }); break; }
      case 'habit-archive': {
        const h = S.setup.habits.find(x => x.id === el.dataset.id);
        if(!h || !confirm('להסיר את "' + h.name + '" מהיום והלאה? ההיסטוריה נשמרת.')) return;
        if(today() <= (h.from || S.setup.startDate)) S.setup.habits = S.setup.habits.filter(x => x.id !== h.id);
        else h.archivedOn = today();
        save(); render();
        break;
      }
      case 'env-add': { const t = val('s-env-new'); if(t){ S.setup.env.push({ id:uid(), text:t, done:false }); save(); render(); } break; }
      case 'env-del': S.setup.env = S.setup.env.filter(x => x.id !== el.dataset.id); save(); render(); break;
      case 'partner-save': S.setup.partner.name = val('s-partner'); save(); toast('נשמר'); break;
      case 'push-on': pushOn(); break;
      case 'push-off': pushOff(); break;
      case 'push-test': pushTest(); break;
      case 'backup': backup(); break;
      case 'open-import': openImport(); break;
      case 'import-go': doImport(); break;
      case 'reset':
        if(!confirm('למחוק את כל הנתונים במכשיר הזה?')) return;
        if(!confirm('בטוח? אי אפשר לבטל.')) return;
        if(S.setup && S.setup.notify.on) await pushOff();
        S = emptyState(); draft = null; wizStep = 0;
        save(); render();
        break;
    }
  });

  document.addEventListener('change', (e) => {
    const cb = e.target.closest('[data-act="wiz-env"]');
    if(cb && draft) draft.env[Number(cb.dataset.i)].on = cb.checked;
  });
  document.addEventListener('input', (e) => {
    if(e.target.closest('#g-actual, #g-target, #g-unit')) updateGoalPace();
  });
  document.addEventListener('focusout', (e) => {
    if(e.target.id === 'ex-notes') saveExNotes();
  });

  /* =========================================================
     הפעלה
     ========================================================= */

  const qv = new URLSearchParams(location.search).get('v');
  checkRestoreHash();
  if(S.setup) viewDate = clampDate(today());
  render();
  writeSwConfig();
  if(S.setup && qv === 'review') go('review');
  if(S.setup && qv === 'close' && inRange(today())) openCloseDay(today());
  if(qv) history.replaceState(null, '', location.pathname);
  if(S.setup && S.focusRun && !qv) openFocusRun();

  document.addEventListener('visibilitychange', () => {
    if(document.visibilityState === 'visible' && S.setup && view === 'today' && document.getElementById('sheet').hidden){
      viewDate = clampDate(today());
      render();
    }
  });

  if('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      /* להעלות יחד עם CACHE_NAME ב־sw.js בכל שינוי ב־index.html */
      const SW_VERSION = '2';
      navigator.serviceWorker.register('sw.js?v=' + SW_VERSION).catch(() => {});
    });
  }
})();
</script>
</body>
</html>
